<!DOCTYPE html>
<html lang="zh-CN"><head><link href="favicon.ico" rel="icon"/><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="tianxl64 的论文—代码闭环精读报告库" name="description"/><title>PaperReading · 论文代码精读库</title><style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1d2630;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent2:#bc8cff;--green:#3fb950;--gold:#d29922;--teal:#56d4dd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#1b3a55 0%,transparent 60%),var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:48px 22px 70px}header{text-align:center;margin:0 auto 30px;max-width:850px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:0 0 12px;background:linear-gradient(120deg,var(--accent),var(--accent2),var(--teal));-webkit-background-clip:text;color:transparent}header p{color:var(--muted);font-size:1.08rem;margin:0}.meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.pill{padding:5px 12px;border:1px solid var(--border);border-radius:99px;background:#ffffff08;color:#c9d1d9;font-size:.86rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px auto;max-width:760px}.stat{background:#ffffff08;border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center}.num{font-size:1.65rem;font-weight:700;color:var(--accent)}.label{color:var(--muted);font-size:.78rem}.search{display:flex;gap:10px;margin:25px 0 35px}.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;color:var(--text);font-size:1rem;outline:none}.search input:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:9px 12px;border-radius:8px}.filter.active,.filter:hover{color:var(--text);border-color:var(--accent);background:#1f6feb22}.section{margin:38px 0}.section-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:15px}.section-head h2{font-size:1.24rem;margin:0}.badge{margin-left:auto;color:var(--muted);font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--text);background:linear-gradient(145deg,var(--surface),#111820);border:1px solid var(--border);border-radius:12px;padding:18px;min-height:150px;transition:.18s transform,.18s border-color,.18s box-shadow}.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 28px #0006}.card-top{display:flex;justify-content:space-between;gap:8px}.card h3{color:var(--accent);font-size:1.04rem;line-height:1.4;margin:0}.tag{font-size:.7rem;color:var(--muted);border:1px solid var(--border);padding:2px 7px;border-radius:99px;white-space:nowrap;height:max-content}.card p{color:var(--muted);font-size:.87rem;margin:0}.card small{color:#6e7681;margin-top:auto}.empty{display:none;color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--border);border-radius:10px}footer{border-top:1px solid var(--border);color:var(--muted);text-align:center;margin-top:45px;padding-top:20px;font-size:.83rem}footer a{color:var(--accent)}@media(max-width:650px){.wrap{padding:30px 14px 50px}.stats{grid-template-columns:repeat(2,1fr)}.search{display:block}.filters{margin-top:10px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><h1>PaperReading</h1><p>论文、代码、机制与证据的长期阅读库</p><div class="meta"><span class="pill">tianxl64</span><span class="pill">Paper + Code + Evidence</span><span class="pill">GitHub Pages</span></div></header><section class="stats"><div class="stat"><div class="num" id="total">—</div><div class="label">篇报告</div></div><div class="stat"><div class="num" id="categories">—</div><div class="label">个方向</div></div><div class="stat"><div class="num">HTML</div><div class="label">直接阅读</div></div><div class="stat"><div class="num">2026</div><div class="label">持续更新</div></div></section><div class="search"><input autocomplete="off" id="search" placeholder="搜索论文、方法、方向或关键词…" type="search"/><div class="filters" id="filters"></div></div><div id="content"></div><div class="empty" id="empty">没有匹配的报告。换一个关键词试试。</div><footer>报告正文来自本地已完成的论文—代码精读产物；索引站只提供公开阅读入口。<br/><a href="https://github.com/tianxl64" rel="noopener" target="_blank">GitHub · tianxl64</a></footer></main><script>
const categoryOrder=['自动驾驶 / VLA','VLA / 具身智能','VLM / 自动驾驶','World / Action Models','World Models / 强化学习','World Models / 自动驾驶','视觉表征 / World Models','自动驾驶 / 轨迹生成','Agentic AI / Policy'];let reports=[];let selected='全部';const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase();const visible=reports.filter(r=>(selected==='全部'||r.category===selected)&&(!q||[r.title,r.category,r.desc].join(' ').toLowerCase().includes(q)));$('total').textContent=reports.length;$('categories').textContent=new Set(reports.map(r=>r.category)).size;const groups=new Map();for(const r of visible){if(!groups.has(r.category))groups.set(r.category,[]);groups.get(r.category).push(r)}let html='';for(const cat of [...categoryOrder,...[...groups.keys()].filter(x=>!categoryOrder.includes(x))]){const rs=groups.get(cat);if(!rs)continue;html+=`<section class="section"><div class="section-head"><h2>${esc(cat)}</h2><span class="badge">${rs.length} 篇</span></div><div class="grid">${rs.map(r=>`<a class="card" href="${r.output}"><div class="card-top"><h3>${esc(r.title)}</h3><span class="tag">${esc(r.priority)}</span></div><p>${esc(r.desc)}</p><small>进入报告 →</small></a>`).join('')}</div></section>`}$('content').innerHTML=html;$('empty').style.display=visible.length?'none':'block'}async function init(){const data=await fetch('./reports.json').then(r=>r.json());reports=data.reports;const cats=['全部',...new Set(reports.map(r=>r.category))];$('filters').innerHTML=cats.map(c=>`<button class="filter${c==='全部'?' active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',render);render()}init().catch(e=>{$('content').innerHTML='<p>报告索引加载失败，请刷新页面。</p>';console.error(e)})
</script></body></html>
