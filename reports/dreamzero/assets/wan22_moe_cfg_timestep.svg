<text class='t title' x='64' y='54'>单个 timestep：MoE 路由 → 同一 Expert 双前向 → CFG → Solver</text><text class='t sub' x='66' y='86'>两次前向共享 x_t、t、Expert 权重与 I2V 首图条件；只替换文本 context</text>
<rect class='lane' x='38' y='140' width='1824' height='150' rx='20'/><text class='t sec' x='64' y='178'>1 · 输入状态与路由</text>
<rect class='state' x='250' y='180' width='240' height='80' rx='16'/><text class='t lab c' x='370' y='212'>x_t</text><text class='t dim c' x='370' y='240'>[1,16,21,90,160]</text>
<rect class='state' x='545' y='180' width='170' height='80' rx='16'/><text class='t lab c' x='630' y='212'>timestep t</text><text class='t dim c' x='630' y='240'>scalar / [1]</text>
<rect class='route' x='790' y='165' width='330' height='110' rx='18'/><text class='t lab c' x='955' y='202'>Boundary Router</text><text class='t body c' x='955' y='230'>t ≥ boundary → High</text><text class='t body c' x='955' y='255'>t &lt; boundary → Low</text>
<rect class='route' x='1200' y='165' width='375' height='110' rx='18'/><text class='t lab c' x='1388' y='202'>Selected Expert</text><text class='t body c' x='1388' y='232'>High-noise 14B 或 Low-noise 14B</text><text class='t sm c' x='1388' y='258'>每轮只选择一套完整 DiT</text>
<path class='ln' d='M490 220H530'/><path class='ln' d='M715 220H775'/><path class='ln' d='M1120 220H1185'/>

<rect class='lane' x='38' y='315' width='1824' height='365' rx='20'/><text class='t sec' x='64' y='354'>2 · 相同状态复制成两条 CFG 条件分支</text>
<rect class='box' x='90' y='405' width='245' height='180' rx='18'/><text class='t lab c' x='212' y='442'>共享输入</text><text class='t dim c' x='212' y='477'>x_t:[1,16,21,90,160]</text><text class='t dim c' x='212' y='506'>t:[1]</text><text class='t sm c' x='212' y='536'>I2V 时 y 也相同</text><text class='t sm c' x='212' y='562'>此时 latent 尚未更新</text>
<rect class='pos' x='445' y='380' width='400' height='235' rx='22'/><text class='t lab c' x='645' y='420'>Positive Branch</text><text class='t body c' x='645' y='452'>context_pos:[1,512,4096]</text><text class='t sm c' x='645' y='482'>→ text projection:[1,512,5120]</text><text class='t body c' x='645' y='520'>selected_expert(x_t,t,context_pos)</text><text class='t dim c' x='645' y='555'>v_pos=[1,16,21,90,160]</text><text class='t sm c' x='645' y='586'>描述“向正向 prompt 靠近”的方向</text>
<rect class='neg' x='920' y='380' width='400' height='235' rx='22'/><text class='t lab c' x='1120' y='420'>Negative / Baseline Branch</text><text class='t body c' x='1120' y='452'>context_neg:[1,512,4096]</text><text class='t sm c' x='1120' y='482'>→ text projection:[1,512,5120]</text><text class='t body c' x='1120' y='520'>selected_expert(x_t,t,context_neg)</text><text class='t dim c' x='1120' y='555'>v_neg=[1,16,21,90,160]</text><text class='t sm c' x='1120' y='586'>默认通常是负向 prompt，并非严格空文本</text>
<rect class='box' x='1400' y='405' width='390' height='180' rx='18'/><text class='t lab c' x='1595' y='442'>两条分支保持相同</text><text class='t body c' x='1595' y='476'>Expert 参数 · x_t · t · y</text><text class='t body c' x='1595' y='506'>视频尺寸 · patch grid</text><text class='t sm c' x='1595' y='542'>唯一核心差别：text context</text><text class='t sm c' x='1595' y='567'>因此差值可以解释为条件方向</text>
<path class='ln' d='M335 455C380 455 390 455 430 455'/><path class='ln' d='M335 535C380 535 390 535 430 535'/><path class='ln' d='M335 495C380 495 875 495 905 495'/><path class='dash' d='M1320 495H1385'/>
<rect class='lane' x='38' y='705' width='1824' height='320' rx='20'/><text class='t sec' x='64' y='744'>3 · 两路汇合并产生唯一下一状态</text>
<rect class='cfg' x='185' y='790' width='405' height='160' rx='20'/><text class='t lab c' x='388' y='830'>Classifier-Free Guidance</text><text class='t body c' x='388' y='868'>v_cfg = v_neg + s·(v_pos − v_neg)</text><text class='t dim c' x='388' y='902'>[1,16,21,90,160]</text><text class='t sm c' x='388' y='930'>T2V: High s=4.0 · Low s=3.0</text>
<rect class='solver' x='760' y='770' width='430' height='205' rx='20'/><text class='t lab c' x='975' y='812'>UniPC / DPM++ Scheduler</text><text class='t body c' x='975' y='848'>flow_prediction → x0_pred</text><text class='t body c' x='975' y='878'>结合当前 sample 与历史 model outputs</text><text class='t body c' x='975' y='908'>高阶数值积分到下一个 timestep</text><text class='t sm c' x='975' y='941'>solver 不读取 prompt，也不选择 Expert</text>
<rect class='state' x='1380' y='790' width='340' height='160' rx='20'/><text class='t lab c' x='1550' y='830'>x_next</text><text class='t dim c' x='1550' y='868'>[1,16,21,90,160]</text><text class='t body c' x='1550' y='902'>本轮唯一保留的生成状态</text><text class='t sm c' x='1550' y='930'>下一轮可能由另一 Expert 继续处理</text>
<path class='ln' d='M645 615C645 700 388 700 388 775'/><path class='ln' d='M1120 615C1120 690 520 690 520 775'/><path class='ln' d='M590 870H745'/><path class='ln' d='M1190 870H1365'/>
<path class='dash' d='M1550 950V1055H370V275'/><text class='t sm' x='705' y='1080'>循环回边：只有 scheduler.step 更新 latent；CFG 的第二次前向不会读取第一次前向的输出</text>
<rect x='115' y='1040' width='430' height='70' rx='14' fill='#0F1B36'/><text x='330' y='1068' text-anchor='middle' fill='white' font-family='Consolas,monospace' font-size='14'>40 timesteps × 2 CFG branches</text><text x='330' y='1094' text-anchor='middle' fill='#BFD4FF' font-family='Consolas,monospace' font-size='14'>≈ 80 expert forwards</text>
