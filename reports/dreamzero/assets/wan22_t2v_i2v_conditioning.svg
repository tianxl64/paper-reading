<defs>
<linearGradient id='h' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#0B132B'/><stop offset='1' stop-color='#254D91'/></linearGradient>
<marker id='a' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0 0L12 6 0 12Z' fill='#315FC2'/></marker>
<marker id='g' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0 0L12 6 0 12Z' fill='#16835B'/></marker>
<marker id='p' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0 0L12 6 0 12Z' fill='#7C3AED'/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#14213D}.title{font-size:35px;font-weight:800;fill:white}.sub{font-size:16px;fill:#DCE8FF}.sec{font-size:21px;font-weight:800;fill:#213F74}.laneTitle{font-size:25px;font-weight:800}.lab{font-size:17px;font-weight:750}.body{font-size:14px}.sm{font-size:12px;fill:#5D6B82}.dim{font-family:Consolas,monospace;font-size:12px;fill:#23437A}.c{text-anchor:middle}.box{fill:white;stroke:#B4C5E7;stroke-width:2}.prompt{fill:#FFF8E7;stroke:#E2B94E;stroke-width:2}.latent{fill:#EAF2FF;stroke:#4E79D9;stroke-width:2}.cond{fill:#F1EAFF;stroke:#8466CC;stroke-width:2}.shared{fill:#E9F8F3;stroke:#2D9B76;stroke-width:2}.route{fill:#F3ECFF;stroke:#8466CC;stroke-width:2}.cfg{fill:#FFF0E5;stroke:#E18B3C;stroke-width:2}.solver{fill:#E8F8F2;stroke:#2D9B76;stroke-width:2}.t2v{fill:#EEF5FF;stroke:#4E79D9;stroke-width:2}.i2v{fill:#FFF4E8;stroke:#E28B43;stroke-width:2}.ln{fill:none;stroke:#315FC2;stroke-width:3;marker-end:url(#a)}.green{fill:none;stroke:#16835B;stroke-width:3;marker-end:url(#g)}.dash{fill:none;stroke:#7C3AED;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#p)}.guide{fill:none;stroke:#99A9C5;stroke-width:2;stroke-dasharray:7 7}</style>
