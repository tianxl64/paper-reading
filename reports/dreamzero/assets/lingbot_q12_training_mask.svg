<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><filter id="sh2"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#405fbd"/></marker><style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18243e}.title{font-size:34px;font-weight:800}.sub{font-size:18px;fill:#56647e}.h{font-size:24px;font-weight:800}.m{font-size:17px;font-weight:700}.s{font-size:14px;fill:#53617b}.box{rx:16;stroke-width:2;filter:url(#sh2)}.arrow{stroke:#405fbd;stroke-width:3;fill:none;marker-end:url(#a2)}.ok{fill:#dff5e7;stroke:#4b9c69}.no{fill:#fae5e3;stroke:#ce6b62}.self{fill:#e7edff;stroke:#6680d2}.hist{fill:#fff2d8;stroke:#c38b2f}</style></defs>
<rect width="1800" height="1220" fill="url(#bg2)"/>
<text x="900" y="55" text-anchor="middle" class="t title">LingBot-VA Release 训练：四段 token 一次 forward，靠 block mask 实现 Video→Action 因果顺序</text>
<text x="900" y="88" text-anchor="middle" class="t sub">拼接顺序：[noisy video, clean video, noisy action, clean action]；每个训练 sample 的整段序列再按随机 chunk_size 分块</text>

<rect x="65" y="125" width="1670" height="205" fill="#fff" stroke="#9aa9c9" class="box"/>
<text x="105" y="165" class="t h">A. 输入与维度（以一个 chunk g 为例）</text>
<rect x="105" y="195" width="340" height="90" fill="#e7efff" stroke="#5f7fd2" class="box"/><text x="275" y="227" text-anchor="middle" class="t m">Noisy Video Ṽg</text><text x="275" y="252" text-anchor="middle" class="t s">B×48×K×Hᶻ×Wᶻ → video patch tokens</text><text x="275" y="273" text-anchor="middle" class="t s">noise_id=0 · block_id=2g</text>
<rect x="505" y="195" width="340" height="90" fill="#dff5e7" stroke="#4b9c69" class="box"/><text x="675" y="227" text-anchor="middle" class="t m">Clean/Condition Video Vg</text><text x="675" y="252" text-anchor="middle" class="t s">GT latent；50% 概率先加 condition noise</text><text x="675" y="273" text-anchor="middle" class="t s">noise_id=1 · block_id=2g</text>
<rect x="905" y="195" width="340" height="90" fill="#fff0e7" stroke="#d37951" class="box"/><text x="1075" y="227" text-anchor="middle" class="t m">Noisy Action Ãg</text><text x="1075" y="252" text-anchor="middle" class="t s">B×Cₐ×K×Nₐ×1 → K·Nₐ tokens</text><text x="1075" y="273" text-anchor="middle" class="t s">noise_id=0 · block_id=2g+1</text>
<rect x="1305" y="195" width="340" height="90" fill="#fff5dd" stroke="#c38b2f" class="box"/><text x="1475" y="227" text-anchor="middle" class="t m">Clean/Condition Action Ag</text><text x="1475" y="252" text-anchor="middle" class="t s">GT action history copy；有效 channel mask</text><text x="1475" y="273" text-anchor="middle" class="t s">noise_id=1 · block_id=2g+1</text>

<rect x="65" y="365" width="1670" height="505" fill="#fff" stroke="#9aa9c9" class="box"/>
<text x="105" y="407" class="t h">B. Query → Key/Value 可见性矩阵</text>
<text x="105" y="438" class="t sub">绿色=可见；红色=禁止；蓝色=仅同 block noisy-to-noisy；黄色=历史 clean。每个绿色区域内部 token 全双向。</text>
<g transform="translate(180 470)">
<text x="285" y="-18" text-anchor="middle" class="t m">历史 clean V/A（block &lt; 当前）</text><text x="625" y="-18" text-anchor="middle" class="t m">当前 clean Vg</text><text x="905" y="-18" text-anchor="middle" class="t m">当前 noisy Ṽg</text><text x="1190" y="-18" text-anchor="middle" class="t m">当前 clean Ag</text><text x="1470" y="-18" text-anchor="middle" class="t m">当前 noisy Ãg</text>
<text x="-25" y="75" text-anchor="end" class="t m">Query: noisy Ṽg</text><text x="-25" y="180" text-anchor="end" class="t m">Query: noisy Ãg</text><text x="-25" y="285" text-anchor="end" class="t m">Query: clean Vg</text><text x="-25" y="390" text-anchor="end" class="t m">Query: clean Ag</text>
<rect x="0" y="20" width="570" height="80" class="hist"/><text x="285" y="58" text-anchor="middle" class="t m">可见：历史 V/A</text><text x="285" y="82" text-anchor="middle" class="t s">strictly earlier clean blocks</text>
<rect x="580" y="20" width="250" height="80" class="no"/><text x="705" y="68" text-anchor="middle" class="t m">禁止</text><rect x="840" y="20" width="250" height="80" class="self"/><text x="965" y="56" text-anchor="middle" class="t m">可见</text><text x="965" y="80" text-anchor="middle" class="t s">同 chunk video 双向</text><rect x="1100" y="20" width="250" height="80" class="no"/><text x="1225" y="68" text-anchor="middle" class="t m">禁止</text><rect x="1360" y="20" width="220" height="80" class="no"/><text x="1470" y="68" text-anchor="middle" class="t m">禁止</text>
<rect x="0" y="125" width="570" height="80" class="hist"/><text x="285" y="163" text-anchor="middle" class="t m">可见：历史 V/A</text><text x="285" y="187" text-anchor="middle" class="t s">teacher-forced clean history</text><rect x="580" y="125" width="250" height="80" class="ok"/><text x="705" y="158" text-anchor="middle" class="t m">可见：Vg</text><text x="705" y="184" text-anchor="middle" class="t s">inverse dynamics 关键边</text><rect x="840" y="125" width="250" height="80" class="no"/><text x="965" y="173" text-anchor="middle" class="t m">禁止</text><rect x="1100" y="125" width="250" height="80" class="no"/><text x="1225" y="173" text-anchor="middle" class="t m">禁止</text><rect x="1360" y="125" width="220" height="80" class="self"/><text x="1470" y="158" text-anchor="middle" class="t m">可见</text><text x="1470" y="184" text-anchor="middle" class="t s">同 chunk action 双向</text>
<rect x="0" y="230" width="570" height="80" class="hist"/><text x="285" y="278" text-anchor="middle" class="t m">可见：历史 clean</text><rect x="580" y="230" width="250" height="80" class="ok"/><text x="705" y="278" text-anchor="middle" class="t m">可见自身 clean Vg</text><rect x="840" y="230" width="250" height="80" class="no"/><text x="965" y="278" text-anchor="middle" class="t m">禁止 noisy</text><rect x="1100" y="230" width="250" height="80" class="no"/><text x="1225" y="278" text-anchor="middle" class="t m">未来，禁止</text><rect x="1360" y="230" width="220" height="80" class="no"/><text x="1470" y="278" text-anchor="middle" class="t m">禁止</text>
<rect x="0" y="335" width="570" height="80" class="hist"/><text x="285" y="383" text-anchor="middle" class="t m">可见：历史 clean</text><rect x="580" y="335" width="250" height="80" class="ok"/><text x="705" y="383" text-anchor="middle" class="t m">可见 Vg</text><rect x="840" y="335" width="250" height="80" class="no"/><text x="965" y="383" text-anchor="middle" class="t m">禁止 noisy</text><rect x="1100" y="335" width="250" height="80" class="ok"/><text x="1225" y="383" text-anchor="middle" class="t m">可见自身 clean Ag</text><rect x="1360" y="335" width="220" height="80" class="no"/><text x="1470" y="383" text-anchor="middle" class="t m">禁止 noisy</text>
</g>

<rect x="65" y="905" width="1670" height="250" fill="#fff" stroke="#9aa9c9" class="box"/>
<text x="105" y="948" class="t h">C. 这张 mask 真正实现了什么？</text>
<rect x="105" y="982" width="480" height="125" fill="#e7efff" stroke="#5f7fd2" class="box"/><text x="345" y="1018" text-anchor="middle" class="t m">Video chunk g</text><text x="345" y="1047" text-anchor="middle" class="t s">只依赖历史 clean V/A + 本 chunk noisy V</text><text x="345" y="1073" text-anchor="middle" class="t s">不能偷看当前 action；chunk 内并行去噪</text><text x="345" y="1097" text-anchor="middle" class="t s">因此是 block-autoregressive，不是逐帧 AR</text>
<path d="M585 1045 H660" class="arrow"/>
<rect x="660" y="982" width="480" height="125" fill="#fff0e7" stroke="#d37951" class="box"/><text x="900" y="1018" text-anchor="middle" class="t m">Action chunk g</text><text x="900" y="1047" text-anchor="middle" class="t s">额外读取当前 clean future-video Vg</text><text x="900" y="1073" text-anchor="middle" class="t s">执行 inverse dynamics：看“结果影片”反推动作</text><text x="900" y="1097" text-anchor="middle" class="t s">训练时 Vg=GT；推理时 Vg=刚预测并 t=0 prefill</text>
<path d="M1140 1045 H1215" class="arrow"/>
<rect x="1215" y="982" width="480" height="125" fill="#f1edff" stroke="#8466c8" class="box"/><text x="1455" y="1018" text-anchor="middle" class="t m">Next video chunk g+1</text><text x="1455" y="1047" text-anchor="middle" class="t s">可以读取已经成为历史的 clean Vg/Ag</text><text x="1455" y="1073" text-anchor="middle" class="t s">闭环 server 会用真实观测/已执行动作替换预测 KV</text><text x="1455" y="1097" text-anchor="middle" class="t s">纯 open-loop demo 则继续吃预测历史</text>
<text x="900" y="1192" text-anchor="middle" class="t sub">源码对应：model.py init_mask/_get_mask_mod + forward_train；训练随机 chunk_size=1..4、window_size=4..64。</text>
</svg>
