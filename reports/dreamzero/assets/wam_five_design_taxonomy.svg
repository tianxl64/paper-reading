<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1040' viewBox='0 0 1600 1040'>
<title>五类 WAM 设计范式统一比较</title><defs><linearGradient id='bg' x2='1' y2='1'><stop stop-color='#071426'/><stop offset='1' stop-color='#102948'/></linearGradient><linearGradient id='g1'><stop stop-color='#2563eb'/><stop offset='1' stop-color='#06b6d4'/></linearGradient><linearGradient id='g2'><stop stop-color='#7c3aed'/><stop offset='1' stop-color='#d946ef'/></linearGradient><linearGradient id='g3'><stop stop-color='#d97706'/><stop offset='1' stop-color='#ef4444'/></linearGradient><filter id='s'><feDropShadow dx='0' dy='7' stdDeviation='9' flood-opacity='.28'/></filter><marker id='a1' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#67e8f9'/></marker><marker id='a2' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#e879f9'/></marker><marker id='a3' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#fb923c'/></marker><style>text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif}.T{font-size:38px;font-weight:800;fill:#f8fafc}.S{font-size:17px;fill:#b9c8dc}.L{font-size:24px;font-weight:800;fill:#fff}.C{font-size:21px;font-weight:800;fill:#fff}.B{font-size:15px;fill:#d8e5f5}.N{font-size:13px;fill:#aebfd4}.K{font-size:13px;font-weight:800;fill:#fff}.P{font-size:12px;font-weight:800;fill:#071426}</style></defs><rect width='1600' height='1040' rx='30' fill='url(#bg)'/><text x='62' y='67' class='T'>五类 WAM 的真正分水岭：动作 token 在决策时到底能看见什么？</text><text x='62' y='101' class='S'>检查主干数量、参数共享、V↔A attention 边、生成次序，以及预测世界是否真的进入控制路径。</text>
<g transform='translate(54 132)'><rect width='1492' height='267' rx='24' fill='#0d2340' stroke='#1e75c9' stroke-width='2'/><rect width='270' height='267' rx='24' fill='url(#g1)'/><text x='28' y='48' class='L'>① Joint-modeling</text><text x='28' y='78' class='B'>同一目标块联合求解 V 与 A</text><text x='28' y='120' class='B'>关键：是否开放 V→A、A→V</text><text x='28' y='146' class='B'>而不是仅仅使用同一个 loss。</text>
<g transform='translate(300 24)' filter='url(#s)'><rect width='360' height='219' rx='18' fill='#122e52' stroke='#38bdf8'/><text x='22' y='37' class='C'>DreamZero</text><rect x='228' y='17' width='112' height='28' rx='14' fill='#67e8f9'/><text x='246' y='36' class='P'>1 shared DiT</text><rect x='25' y='66' width='72' height='34' rx='9' fill='#2563eb'/><text x='44' y='88' class='K'>Vₖᵗ</text><rect x='257' y='66' width='72' height='34' rx='9' fill='#ef4444'/><text x='276' y='88' class='K'>Aₖᵗ</text><path d='M103 83H249' stroke='#67e8f9' stroke-width='3' marker-end='url(#a1)'/><path d='M251 95H105' stroke='#67e8f9' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#a1)'/><text x='22' y='128' class='B'>共享 QKV / FFN / Norm；同块联合 flow</text><text x='22' y='154' class='B'>跨 chunk causal；真实观测写 visual KV</text><text x='22' y='182' class='N'>chunk 内并行去噪；外层环境闭环 AR</text></g>
<g transform='translate(682 24)' filter='url(#s)'><rect width='360' height='219' rx='18' fill='#122e52' stroke='#38bdf8'/><text x='22' y='37' class='C'>DriveVA</text><rect x='228' y='17' width='112' height='28' rx='14' fill='#67e8f9'/><text x='246' y='36' class='P'>1 shared DiT</text><rect x='25' y='66' width='86' height='34' rx='9' fill='#2563eb'/><text x='38' y='88' class='K'>Vfutureᵗ</text><rect x='257' y='66' width='72' height='34' rx='9' fill='#ef4444'/><text x='282' y='88' class='K'>τᵗ</text><path d='M113 83H249' stroke='#67e8f9' stroke-width='3' marker-end='url(#a1)'/><path d='M251 95H115' stroke='#67e8f9' stroke-width='3' marker-end='url(#a1)'/><text x='22' y='128' class='B'>future video / trajectory 同一 target block</text><text x='22' y='154' class='B'>release 默认 full bidirectional attention</text><text x='22' y='182' class='N'>跨窗口 rollout 由外层调用方组织</text></g>
<g transform='translate(1064 24)' filter='url(#s)'><rect width='402' height='219' rx='18' fill='#122e52' stroke='#38bdf8'/><text x='22' y='37' class='C'>X-Foresight（特殊联合型）</text><rect x='22' y='66' width='88' height='34' rx='9' fill='#334155'/><text x='34' y='88' class='K'>promptₖ</text><rect x='152' y='66' width='80' height='34' rx='9' fill='#ef4444'/><text x='179' y='88' class='K'>Aₖ</text><rect x='274' y='66' width='104' height='34' rx='9' fill='#2563eb'/><text x='287' y='88' class='K'>cameraₖ</text><path d='M112 83H144' stroke='#67e8f9' stroke-width='3' marker-end='url(#a1)'/><path d='M234 83H266' stroke='#67e8f9' stroke-width='3' marker-end='url(#a1)'/><text x='22' y='128' class='B'>LDM 联合回归 action / camera / BEV</text><text x='22' y='154' class='B'>独立 RF renderer 生成像素视频</text><text x='22' y='182' class='N'>action 无需等待 renderer；无官方代码</text></g></g>
<g transform='translate(54 422)'><rect width='1492' height='267' rx='24' fill='#221943' stroke='#8b5cf6' stroke-width='2'/><rect width='270' height='267' rx='24' fill='url(#g2)'/><text x='28' y='48' class='L'>② Future video → action</text><text x='28' y='78' class='B'>先生成未来视觉，再生成动作</text><text x='28' y='120' class='B'>动作计算图真正经过</text><text x='28' y='146' class='B'>model-predicted future video。</text>
<g transform='translate(300 24)' filter='url(#s)'><rect width='554' height='219' rx='18' fill='#30245d' stroke='#c084fc'/><text x='22' y='37' class='C'>LingBot-VA</text><rect x='360' y='17' width='174' height='28' rx='14' fill='#e879f9'/><text x='375' y='36' class='P'>paper ≠ release topology</text><rect x='24' y='65' width='104' height='36' rx='9' fill='#2563eb'/><text x='42' y='88' class='K'>denoise Vₖ</text><rect x='222' y='65' width='110' height='36' rx='9' fill='#7c3aed'/><text x='243' y='88' class='K'>cache K/V</text><rect x='422' y='65' width='106' height='36' rx='9' fill='#ef4444'/><text x='438' y='88' class='K'>denoise Aₖ</text><path d='M130 83H214' stroke='#e879f9' stroke-width='3' marker-end='url(#a2)'/><path d='M334 83H414' stroke='#e879f9' stroke-width='3' marker-end='url(#a2)'/><text x='22' y='129' class='B'>论文：dual-stream MoT，video/action blocks 独立</text><text x='22' y='154' class='B'>release：一套 30-layer blocks，共享 QKV/FFN/Norm</text><text x='22' y='180' class='N'>训练 A 读同块 GT clean V；推理 A 读生成 V 的 KV</text></g>
<g transform='translate(878 24)' filter='url(#s)'><rect width='588' height='219' rx='18' fill='#30245d' stroke='#c084fc'/><text x='22' y='37' class='C'>Fast-WAM-IDM</text><rect x='420' y='17' width='146' height='28' rx='14' fill='#e879f9'/><text x='436' y='36' class='P'>2 independent DiTs</text><rect x='24' y='65' width='135' height='36' rx='9' fill='#2563eb'/><text x='42' y='88' class='K'>VideoDiT: Vₖ</text><rect x='224' y='65' width='132' height='36' rx='9' fill='#334155'/><text x='242' y='88' class='K'>future V K/V</text><rect x='421' y='65' width='142' height='36' rx='9' fill='#ef4444'/><text x='438' y='88' class='K'>ActionDiT: Aₖ</text><path d='M161 83H216' stroke='#e879f9' stroke-width='3' marker-end='url(#a2)'/><path d='M358 83H413' stroke='#e879f9' stroke-width='3' marker-end='url(#a2)'/><text x='22' y='129' class='B'>VideoDiT / ActionDiT 各有 Norm、QKV、FFN</text><text x='22' y='154' class='B'>共享的是 attention 信息，不是 tensor 参数</text><text x='22' y='180' class='N'>显式 test-time imagination；路径直观但计算最重</text></g></g>
<g transform='translate(54 712)'><rect width='1492' height='244' rx='24' fill='#3a1d17' stroke='#f97316' stroke-width='2'/><rect width='270' height='244' rx='24' fill='url(#g3)'/><text x='28' y='48' class='L'>③ Video only as objective</text><text x='28' y='78' class='B'>训练预测视频，推理动作不看</text><text x='28' y='120' class='B'>世界预测是 representation</text><text x='28' y='146' class='B'>regularizer，而非在线中间量。</text>
<g transform='translate(300 23)' filter='url(#s)'><rect width='734' height='198' rx='18' fill='#52291e' stroke='#fb923c'/><text x='22' y='38' class='C'>Fast-WAM Base</text><rect x='553' y='18' width='160' height='28' rx='14' fill='#fb923c'/><text x='567' y='37' class='P'>2 experts + MoT</text><rect x='24' y='66' width='135' height='36' rx='9' fill='#2563eb'/><text x='39' y='89' class='K'>Video expert</text><rect x='285' y='66' width='150' height='36' rx='9' fill='#334155'/><text x='302' y='89' class='K'>mixed attention</text><rect x='558' y='66' width='151' height='36' rx='9' fill='#ef4444'/><text x='572' y='89' class='K'>Action expert</text><path d='M161 84H277' stroke='#fb923c' stroke-width='3' stroke-dasharray='7 5' marker-end='url(#a3)'/><path d='M437 84H550' stroke='#fb923c' stroke-width='3' marker-end='url(#a3)'/><text x='22' y='142' class='N'>训练：video co-training 塑造动态表示</text><text x='22' y='174' class='B'>推理：prefill 当前观测 → 直接迭代 ActionDiT；不采样 future V</text></g>
<g transform='translate(1058 23)' filter='url(#s)'><rect width='408' height='198' rx='18' fill='#52291e' stroke='#fb923c'/><text x='22' y='38' class='C'>Fast-WAM-Joint（中间态）</text><rect x='24' y='66' width='126' height='36' rx='9' fill='#2563eb'/><text x='38' y='89' class='K'>noisy Vᵗ</text><rect x='258' y='66' width='126' height='36' rx='9' fill='#ef4444'/><text x='274' y='89' class='K'>noisy Aᵗ</text><path d='M152 84H250' stroke='#fb923c' stroke-width='3' marker-end='url(#a3)'/><text x='22' y='130' class='B'>开放 Vᵗ→Aᵗ，不开放 Aᵗ→Vᵗ</text><text x='22' y='158' class='N'>A 看仍在去噪的 future V，不是 clean V。</text></g></g>
<text x='64' y='1003' class='N'>AR 多数指 chunk/window 级顺序生成；同一 chunk 内通常并行去噪，而非逐 token 语言模型式 AR。</text>
</svg>
