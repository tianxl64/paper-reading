<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient><marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d62f45"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e57b16"/></marker><style>.h0{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:white}.h{font:700 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14233c}.t{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172033}.s{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.m{font:14px Consolas,monospace;fill:#13213a}.box{fill:white;stroke:#7b95b1;stroke-width:1.7;rx:13}.v{fill:#edf6ff;stroke:#2f6da9}.a{fill:#f4efff;stroke:#7855b2}.f{fill:#ebfaf5;stroke:#178977}.lossA{fill:#fff0f2;stroke:#d62f45}.lossV{fill:#fff5e8;stroke:#db7b18}.gray{fill:#f1f3f6;stroke:#9aa5b1}.note{fill:#fffbea;stroke:#af8a24}.fw{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#af)}.ga{stroke:#d62f45;stroke-width:3;fill:none;marker-end:url(#ar)}.gai{stroke:#d62f45;stroke-width:2.4;stroke-dasharray:8 5;fill:none;marker-end:url(#ar)}.gv{stroke:#e57b16;stroke-width:3;fill:none;marker-end:url(#ao)}.zero{stroke:#8b95a2;stroke-width:2;stroke-dasharray:6 5;fill:none}</style></defs>
<rect width="1800" height="1180" fill="url(#g)"/><rect width="1800" height="62" fill="#17345d"/><text x="900" y="41" text-anchor="middle" class="h0">Fast-WAM：action loss 与 video loss 如何训练 f₀ 表征及 VideoDiT 参数</text>

<rect x="24" y="82" width="1752" height="338" class="box"/><text x="48" y="116" class="h">A. 单层前向：Action query 读取 f₀ 的 K/V，但不读取 future video</text>
<g transform="translate(48 146)"><rect width="220" height="116" class="box v"/><text x="110" y="27" text-anchor="middle" class="h">f₀ hidden X₀ˡ</text><text x="110" y="57" text-anchor="middle" class="s">Norm1 + AdaLN(shift/scale)</text><text x="110" y="84" text-anchor="middle" class="m">Q₀ˡ,K₀ˡ,V₀ˡ</text></g>
<g transform="translate(48 284)"><rect width="220" height="96" class="box f"/><text x="110" y="27" text-anchor="middle" class="h">future hidden X₊ˡ</text><text x="110" y="57" text-anchor="middle" class="m">Q₊ˡ,K₊ˡ,V₊ˡ</text><text x="110" y="80" text-anchor="middle" class="s">video-loss query rows</text></g>
<path d="M268 204H340" class="fw"/><path d="M268 332H340" class="fw"/>
<g transform="translate(340 139)"><rect width="320" height="248" class="box v"/><text x="160" y="28" text-anchor="middle" class="h">Video mixed self-attention</text><text x="18" y="61" class="s">f₀ query：只看 f₀ K/V</text><text x="18" y="89" class="s">future query：看 f₀ + 全部 future K/V</text><text x="18" y="121" class="m">Yᵥˡ = Attn(Qᵥˡ,Kᵥˡ,Vᵥˡ,Mᵥ)</text><text x="18" y="157" class="s">Video post：</text><text x="18" y="181" class="s">O projection + residual</text><text x="18" y="205" class="s">Cross-Attn(text) + FFN</text><text x="18" y="229" class="m">→ Xᵥˡ⁺¹</text></g>
<g transform="translate(750 146)"><rect width="220" height="116" class="box a"/><text x="110" y="27" text-anchor="middle" class="h">action hidden Aˡ</text><text x="110" y="57" text-anchor="middle" class="s">Action Expert Norm/AdaLN</text><text x="110" y="84" text-anchor="middle" class="m">Qₐˡ,Kₐˡ,Vₐˡ</text></g>
<path d="M970 204H1040" class="fw"/><path d="M268 204 C570 204,680 292,1040 292" class="fw"/>
<g transform="translate(1040 139)"><rect width="360" height="248" class="box a"/><text x="180" y="28" text-anchor="middle" class="h">Action mixed attention</text><text x="18" y="62" class="m">Kcat=[K₀ˡ ; Kₐˡ]</text><text x="18" y="90" class="m">Vcat=[V₀ˡ ; Vₐˡ]</text><text x="18" y="120" class="m">Yₐˡ=Attn(Qₐˡ,Kcat,Vcat)</text><text x="18" y="156" class="s">只使用 f₀ 的 K/V；future K/V 被 mask</text><text x="18" y="184" class="s">随后执行 Action O/Cross-Attn/FFN</text><text x="18" y="214" class="m">→ Aˡ⁺¹</text></g>
<g transform="translate(1480 170)"><rect width="250" height="170" class="box note"/><text x="125" y="28" text-anchor="middle" class="h">共享注意力≠共享参数</text><text x="16" y="60" class="s">Video QKV/O/FFN 属于 VideoDiT</text><text x="16" y="87" class="s">Action QKV/O/FFN 属于 ActionDiT</text><text x="16" y="114" class="s">两者只在 attention 中拼接 Q/K/V</text><text x="16" y="142" class="s">梯度沿实际可见边回传</text></g>

<rect x="24" y="442" width="1752" height="358" class="box"/><text x="48" y="476" class="h">B. 只看 ∂L_action：每层都有“直接 K/V 梯度”，前 29 层另有“经后续层的间接梯度”</text>
<g transform="translate(48 510)"><rect width="210" height="190" class="box v"/><text x="105" y="27" text-anchor="middle" class="h">Video layer 1</text><text x="16" y="59" class="s">K/V → action layer 1</text><text x="16" y="86" class="s">Video post → X₀²</text><text x="16" y="113" class="s">X₀² → 后续 K/V</text><text x="16" y="150" class="s">因此 Q/O/Cross/FFN</text><text x="16" y="174" class="s">可收到间接 action 梯度</text></g>
<path d="M258 605H330" class="fw"/><g transform="translate(330 510)"><rect width="210" height="190" class="box v"/><text x="105" y="27" text-anchor="middle" class="h">Video layer 2…29</text><text x="16" y="59" class="s">同样具有：</text><text x="16" y="87" class="s">① 本层 K/V 直接入口</text><text x="16" y="115" class="s">② post→后层 K/V 间接入口</text><text x="16" y="151" class="s">越靠前，间接链越长</text></g>
<path d="M540 605H612" class="fw"/><g transform="translate(612 510)"><rect width="250" height="190" class="box v"/><text x="125" y="27" text-anchor="middle" class="h">Video layer 30（最后层）</text><text x="16" y="59" class="s">Action 直接读取 K₀³⁰,V₀³⁰</text><text x="16" y="88" class="s">但 Xᵥ³¹ 不再被 action 使用</text><text x="16" y="119" class="s">所以 action 梯度只进入：</text><text x="16" y="146" class="s">Norm1、shift/scale_msa、K、V、NormK</text><text x="16" y="174" class="s">不进入 Video Q/O/Cross/FFN/post gates</text></g>
<g transform="translate(985 510)"><rect width="300" height="190" class="box a"/><text x="150" y="27" text-anchor="middle" class="h">30 层 ActionDiT + Action head</text><text x="18" y="63" class="s">L_action 的主干梯度</text><text x="18" y="91" class="s">每层 Qₐ/Kₐ/Vₐ/O、Cross-Attn、FFN</text><text x="18" y="119" class="s">以及 action encoder / time embedding / head</text><text x="18" y="154" class="m">L_action=MSE(v̂ₐ, εₐ-a)</text></g>
<g transform="translate(1450 525)"><rect width="280" height="160" class="box lossA"/><text x="140" y="30" text-anchor="middle" class="h">L_action</text><text x="140" y="65" text-anchor="middle" class="s">红色实线：本层直接 K/V 梯度</text><text x="140" y="94" text-anchor="middle" class="s">红色虚线：经后续 f₀ hidden 间接梯度</text><text x="140" y="125" text-anchor="middle" class="s">future token activations：0 梯度</text></g>
<path d="M1450 580 C1270 450,900 450,790 510" class="ga"/><path d="M1450 610 C1220 760,520 760,420 700" class="gai"/><path d="M1450 650 C1320 720,1180 720,1135 700" class="ga"/>
<rect x="48" y="720" width="814" height="54" class="note"/><text x="455" y="742" text-anchor="middle" class="s">注意：VideoDiT 参数在所有 video token 位置共享。action loss 虽只经过 f₀ 激活，参数更新后也会改变 future token 的处理函数。</text><text x="455" y="762" text-anchor="middle" class="s">但这不代表 action loss 对 future token activation 有梯度；mask 已将该路径切断。</text>

<rect x="24" y="822" width="1752" height="330" class="box"/><text x="48" y="856" class="h">C. 只看 ∂L_video：future query 通过 f₀ K/V 训练锚点表征，同时监督完整 video 输出路径</text>
<g transform="translate(48 890)"><rect width="230" height="180" class="box v"/><text x="115" y="27" text-anchor="middle" class="h">f₀ activation path</text><text x="16" y="61" class="s">future query 在每层读取 f₀ K/V</text><text x="16" y="89" class="s">→ 梯度进入 f₀ hidden</text><text x="16" y="117" class="s">→ 回到 patch embedding</text><text x="16" y="145" class="s">→ 前层 self/cross/FFN</text></g>
<path d="M278 980H340" class="fw"/><g transform="translate(340 880)"><rect width="320" height="200" class="box f"/><text x="160" y="27" text-anchor="middle" class="h">future token path</text><text x="18" y="61" class="s">future Q 读取 f₀ + future K/V</text><text x="18" y="89" class="s">每层 Video Q/K/V/O、Cross-Attn、FFN</text><text x="18" y="117" class="s">最终 Video head / unpatchify</text><text x="18" y="150" class="m">L_video=MSE(v̂_video, ε_video-z)</text><text x="18" y="178" class="s">首帧输出被切片移除，但 future 输出被监督</text></g>
<path d="M660 980H730" class="fw"/><g transform="translate(730 880)"><rect width="330" height="200" class="box lossV"/><text x="165" y="27" text-anchor="middle" class="h">L_video 的重要边界</text><text x="18" y="61" class="s">最后层 f₀ K/V activation：有梯度</text><text x="18" y="89" class="s">最后层 f₀ query/post activation：无 future-loss 梯度</text><text x="18" y="117" class="s">但 Q/O/Cross/FFN 参数仍由 future token rows 更新</text><text x="18" y="150" class="s">所以要区分“某位置激活无梯度”</text><text x="18" y="177" class="s">与“共享参数没有梯度”</text></g>
<g transform="translate(1120 874)"><rect width="610" height="216" class="box"/><text x="305" y="28" text-anchor="middle" class="h">两项 loss 对 VideoDiT 参数的贡献（忽略 weight decay）</text><text x="18" y="62" class="s">Patch / f₀ time embedding：L_action + L_video</text><text x="18" y="90" class="s">前 29 层 Video K/V 与 post(Q/O/Cross/FFN)：L_action（直接+间接） + L_video</text><text x="18" y="118" class="s">第 30 层 Video K/V/Norm1：L_action + L_video</text><text x="18" y="146" class="s">第 30 层 Video Q/O/Cross/FFN/post gates：仅 L_video</text><text x="18" y="174" class="s">Video output head：仅 L_video；ActionDiT / action head：仅 L_action</text><text x="18" y="202" class="m">∇θvideo L = λv∇Lvideo + λa∇Laction</text></g>
<path d="M730 980 C600 1095,300 1100,190 1070" class="gv"/><path d="M1060 980H1110" class="gv"/>
<text x="900" y="1134" text-anchor="middle" class="s">f₀ 本身由冻结 VAE 在 no_grad 下产生，不是 optimizer 参数；所谓“训练 f₀”是训练 VideoDiT 如何把 f₀ 转换为可供 future/action 使用的分层世界表征。</text>
</svg>
