<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1050' viewBox='0 0 1600 1050'>
<title>Fast-WAM execution order, inference cost and f0 gradient paths</title><defs><linearGradient id='bg' x2='1' y2='1'><stop stop-color='#071321'/><stop offset='1' stop-color='#162d50'/></linearGradient><linearGradient id='p1'><stop stop-color='#1d4ed8'/><stop offset='1' stop-color='#7c3aed'/></linearGradient><linearGradient id='p2'><stop stop-color='#047857'/><stop offset='1' stop-color='#0891b2'/></linearGradient><filter id='s'><feDropShadow dx='0' dy='7' stdDeviation='9' flood-opacity='.28'/></filter><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#67e8f9'/></marker><marker id='g' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#34d399'/></marker><marker id='o' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#fb923c'/></marker><style>text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif}.T{font-size:37px;font-weight:800;fill:#f8fafc}.S{font-size:16px;fill:#b9c9dd}.H{font-size:23px;font-weight:800;fill:#fff}.C{font-size:18px;font-weight:800;fill:#fff}.B{font-size:15px;fill:#dbeafe}.N{font-size:13px;fill:#afc1d6}.K{font-size:13px;font-weight:800;fill:#fff}.M{font-family:'Cascadia Mono',Consolas,monospace;font-size:13px;fill:#dbeafe}.D{font-size:21px;font-weight:900;fill:#fef3c7}</style></defs><rect width='1600' height='1050' rx='30' fill='url(#bg)'/><text x='62' y='64' class='T'>Fast-WAM 深入追问：双 DiT 的先后顺序、真正节省的计算，以及 f0 如何被训练</text><text x='62' y='96' class='S'>训练是 layer-synchronous MoT；Base 推理是 one-time video prefill + repeated action denoising；f0 虽无直接 loss，却承接两条梯度路径。</text>
<g transform='translate(54 128)'><rect width='1492' height='264' rx='24' fill='#142b50' stroke='#6366f1' stroke-width='2'/><rect width='238' height='264' rx='24' fill='url(#p1)'/><text x='24' y='47' class='H'>A. Training</text><text x='24' y='80' class='B'>不是整栈先后，</text><text x='24' y='105' class='B'>而是每层同步：</text><text x='24' y='140' class='M'>for layer l:</text><text x='24' y='165' class='M'>  video QKV</text><text x='24' y='190' class='M'>  action QKV</text><text x='24' y='215' class='M'>  mixed attention</text>
<g transform='translate(274 25)' filter='url(#s)'><rect width='1192' height='214' rx='18' fill='#1a3764' stroke='#818cf8'/><rect x='25' y='34' width='190' height='45' rx='10' fill='#2563eb'/><text x='58' y='62' class='K'>Video block l input</text><rect x='25' y='132' width='190' height='45' rx='10' fill='#ef4444'/><text x='57' y='160' class='K'>Action block l input</text><rect x='310' y='34' width='195' height='45' rx='10' fill='#1d4ed8'/><text x='357' y='62' class='K'>Video Q/K/V</text><rect x='310' y='132' width='195' height='45' rx='10' fill='#be123c'/><text x='354' y='160' class='K'>Action Q/K/V</text><rect x='605' y='75' width='207' height='62' rx='12' fill='#7c3aed'/><text x='640' y='101' class='K'>Concat + one mixed</text><text x='668' y='122' class='K'>Attention</text><rect x='915' y='34' width='245' height='45' rx='10' fill='#0e7490'/><text x='946' y='62' class='K'>Video post / FFN → l+1</text><rect x='915' y='132' width='245' height='45' rx='10' fill='#9f1239'/><text x='943' y='160' class='K'>Action post / FFN → l+1</text><path d='M217 56H302' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M217 154H302' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M507 56L597 91' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M507 154L597 120' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M814 91L907 56' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M814 120L907 154' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><text x='430' y='202' class='N'>两边 QKV 在数学上可并行；当前 Python 实现按 expert_order 循环构造，再设置 Attention barrier。</text></g></g>
<g transform='translate(54 418)'><rect width='1492' height='278' rx='24' fill='#0d343d' stroke='#10b981' stroke-width='2'/><rect width='238' height='278' rx='24' fill='url(#p2)'/><text x='24' y='47' class='H'>B. Inference cost</text><text x='24' y='80' class='B'>Base 不只是少 token，</text><text x='24' y='105' class='B'>更移除了整个 future</text><text x='24' y='130' class='B'>video denoising loop。</text><text x='24' y='177' class='M'>Base: 1V + Na·A</text><text x='24' y='205' class='M'>IDM: Nv·V + 1V</text><text x='24' y='230' class='M'>     + Na·A</text>
<g transform='translate(274 23)' filter='url(#s)'><rect width='1192' height='232' rx='18' fill='#12454d' stroke='#34d399'/><text x='22' y='33' class='C'>Fast-WAM Base</text><rect x='25' y='53' width='196' height='48' rx='11' fill='#0e7490'/><text x='53' y='82' class='K'>f0 VideoDiT prefill ×1</text><rect x='307' y='53' width='221' height='48' rx='11' fill='#ef4444'/><text x='343' y='82' class='K'>ActionDiT × N_action</text><path d='M223 77H299' stroke='#34d399' stroke-width='4' marker-end='url(#g)'/><text x='22' y='128' class='N'>不分配 future noise；不运行 video scheduler；不调用 video head/VAE decode。</text><text x='22' y='151' class='N'>Action 每步的 key 长度也从 N0+Nfuture+H 缩短为 N0+H。</text><line x1='22' y1='173' x2='1165' y2='173' stroke='#4f7d82'/><text x='22' y='204' class='C'>Fast-WAM-IDM</text><rect x='205' y='184' width='223' height='36' rx='9' fill='#2563eb'/><text x='234' y='207' class='K'>Full VideoDiT × N_video</text><rect x='505' y='184' width='228' height='36' rx='9' fill='#0e7490'/><text x='531' y='207' class='K'>full-video prefill ×1</text><rect x='810' y='184' width='222' height='36' rx='9' fill='#ef4444'/><text x='843' y='207' class='K'>ActionDiT × N_action</text><path d='M430 202H497' stroke='#fb923c' stroke-width='3' marker-end='url(#o)'/><path d='M735 202H802' stroke='#fb923c' stroke-width='3' marker-end='url(#o)'/></g></g>
<g transform='translate(54 722)'><rect width='1492' height='278' rx='24' fill='#30253e' stroke='#c084fc' stroke-width='2'/><text x='26' y='42' class='H'>C. f0 没有直接 denoise loss，但它不是“冻结条件”：两条 loss 都能训练其 VideoDiT 表示</text><g transform='translate(28 67)' filter='url(#s)'><rect width='1436' height='184' rx='18' fill='#3c2d50' stroke='#d8b4fe'/><rect x='23' y='63' width='165' height='48' rx='11' fill='#0e7490'/><text x='51' y='92' class='K'>f0 clean latent</text><rect x='282' y='25' width='226' height='48' rx='11' fill='#2563eb'/><text x='311' y='54' class='K'>Future-video queries</text><rect x='282' y='111' width='226' height='48' rx='11' fill='#ef4444'/><text x='323' y='140' class='K'>Action queries</text><rect x='620' y='25' width='190' height='48' rx='11' fill='#1d4ed8'/><text x='658' y='54' class='K'>Video loss Lvid</text><rect x='620' y='111' width='190' height='48' rx='11' fill='#be123c'/><text x='657' y='140' class='K'>Action loss Lact</text><rect x='915' y='63' width='252' height='48' rx='11' fill='#7c3aed'/><text x='946' y='92' class='K'>VideoDiT f0 pathway params</text><rect x='1250' y='63' width='160' height='48' rx='11' fill='#475569'/><text x='1283' y='92' class='K'>VAE frozen</text><path d='M190 77L274 52' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M190 97L274 132' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M510 49H612' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M510 135H612' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><path d='M812 49L907 77' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/><path d='M812 135L907 98' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/><path d='M1169 87H1242' stroke='#fb7185' stroke-width='2' stroke-dasharray='7 6'/><text x='907' y='143' class='N'>更新 patch embedding、block K/V/Q/O、Norm/AdaLN、cross-attn、FFN；</text><text x='907' y='165' class='N'>Action loss 还更新整个 ActionDiT。f0 本身不被 scheduler 更新。</text></g></g>
<text x='58' y='1028' class='N'>N_video / N_action 表示各自 scheduler 的网络函数评估次数；Base 不减少 action steps，而是把 VideoDiT 从 N_video 次 full-sequence denoise 降为 1 次 f0-only prefill。</text>
</svg>
