<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker>
    <style>.t{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172033}.s{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.h{font:700 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#13233c}.ttl{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.m{font:14px Consolas,monospace;fill:#12233f}.box{fill:#fff;stroke:#7892ae;stroke-width:1.7;rx:13}.blue{fill:#edf6ff;stroke:#2e69a5}.green{fill:#eafaf6;stroke:#188a7b}.purple{fill:#f3efff;stroke:#7957b4}.orange{fill:#fff4e5;stroke:#cc8017}.cache{fill:#eaf7ff;stroke:#2384bc}.warn{fill:#fffbea;stroke:#af8b25}.arr{stroke:#334155;stroke-width:2.1;fill:none;marker-end:url(#a2)}.dash{stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;fill:none;marker-end:url(#a2)}</style>
  </defs>
  <rect width="1800" height="1050" fill="url(#bg2)"/><rect x="0" y="0" width="1800" height="62" fill="#17345d"/><text x="900" y="41" text-anchor="middle" class="ttl">t=0 VideoDiT Prefill：单层内部、KV 保存时刻与 ActionDiT 复用方式</text>

  <rect x="24" y="82" width="1752" height="170" rx="16" class="box"/><text x="48" y="115" class="h">A. 两种模型进入同一个 prefill 函数，但输入条件不同</text>
  <g transform="translate(48 135)"><rect width="380" height="92" class="box blue"/><text x="190" y="25" text-anchor="middle" class="h">Fast-WAM Base 输入</text><text x="190" y="52" text-anchor="middle" class="m">f₀ → [1,48,1,14,28]</text><text x="190" y="76" text-anchor="middle" class="s">patchify 后 Sᵥ=98；仅当前真实观测</text></g>
  <g transform="translate(470 135)"><rect width="430" height="92" class="box green"/><text x="215" y="25" text-anchor="middle" class="h">Fast-WAM-IDM 输入</text><text x="215" y="52" text-anchor="middle" class="m">ẑ=[f₀,f̂₁,f̂₂] → [1,48,3,14,28]</text><text x="215" y="76" text-anchor="middle" class="s">patchify 后 Sᵥ=294；Stage 1 生成的整段 clean video</text></g>
  <path d="M925 180 H985" class="arr"/><g transform="translate(985 125)"><rect width="320" height="112" class="box orange"/><text x="160" y="25" text-anchor="middle" class="h">共同 pre_dit(tᵥ=0)</text><text x="16" y="52" class="s">Conv3D patch=(1,2,2) → flatten</text><text x="16" y="75" class="s">3D RoPE frequencies + text embedding</text><text x="16" y="98" class="s">token-wise t=0 → 6-way AdaLN modulation</text></g>
  <path d="M1305 180 H1365" class="arr"/><g transform="translate(1365 135)"><rect width="380" height="92" class="box warn"/><text x="190" y="25" text-anchor="middle" class="h">输出给 MoT.prefill_video_cache</text><text x="190" y="52" text-anchor="middle" class="m">X⁰ [B,Sᵥ,3072] + RoPE + t_mod + context</text><text x="190" y="76" text-anchor="middle" class="s">Base/IDM 后续执行机制完全相同</text></g>

  <rect x="24" y="274" width="1752" height="430" rx="16" class="box"/><text x="48" y="308" class="h">B. VideoDiT 第 l 层（l=1…30）：K/V 在哪里保存？</text>
  <g transform="translate(48 340)"><rect width="150" height="110" class="box blue"/><text x="75" y="28" text-anchor="middle" class="h">层输入 Xˡ</text><text x="75" y="58" text-anchor="middle" class="m">[B,Sᵥ,3072]</text><text x="75" y="84" text-anchor="middle" class="s">来自上一层 post</text></g>
  <path d="M198 395 H240" class="arr"/><g transform="translate(240 330)"><rect width="190" height="130" class="box orange"/><text x="95" y="27" text-anchor="middle" class="h">AdaLN(t=0)</text><text x="95" y="55" text-anchor="middle" class="s">shift / scale / gate</text><text x="95" y="80" text-anchor="middle" class="s">调制 self-attn 输入</text><text x="95" y="105" text-anchor="middle" class="m">X̃ˡ</text></g>
  <path d="M430 395 H472" class="arr"/><g transform="translate(472 320)"><rect width="230" height="150" class="box blue"/><text x="115" y="27" text-anchor="middle" class="h">线性投影 + RoPE</text><text x="115" y="58" text-anchor="middle" class="m">Qᵥˡ=WqX̃ˡ</text><text x="115" y="84" text-anchor="middle" class="m">Kᵥˡ=RoPE(WkX̃ˡ)</text><text x="115" y="110" text-anchor="middle" class="m">Vᵥˡ=WvX̃ˡ</text><text x="115" y="135" text-anchor="middle" class="s">24 heads × 128 = 3072</text></g>
  <path d="M702 366 H772" class="arr"/><g transform="translate(772 312)"><rect width="230" height="108" class="box cache"/><text x="115" y="27" text-anchor="middle" class="h">立即保存本层 K/V</text><text x="115" y="55" text-anchor="middle" class="m">cache[l]={Kᵥˡ,Vᵥˡ}</text><text x="115" y="80" text-anchor="middle" class="s">保存的是 attention 前的 K/V</text></g>
  <path d="M702 423 H752 V492 H800" class="arr"/><g transform="translate(800 445)"><rect width="270" height="115" class="box blue"/><text x="135" y="27" text-anchor="middle" class="h">Video Self-Attention</text><text x="135" y="55" text-anchor="middle" class="m">Attn(Qᵥˡ,Kᵥˡ,Vᵥˡ,mask)</text><text x="135" y="82" text-anchor="middle" class="s">Base：98 个 f₀ 空间 token 全连接</text><text x="135" y="103" text-anchor="middle" class="s">IDM：first-frame-causal，Sᵥ=294</text></g>
  <path d="M1070 502 H1112" class="arr"/><g transform="translate(1112 430)"><rect width="280" height="145" class="box purple"/><text x="140" y="27" text-anchor="middle" class="h">本层 post 子结构</text><text x="18" y="56" class="s">attention output projection + gated residual</text><text x="18" y="82" class="s">→ text Cross-Attention</text><text x="18" y="108" class="s">→ AdaLN + FFN + gated residual</text><text x="140" y="132" text-anchor="middle" class="m">得到 Xˡ⁺¹</text></g>
  <path d="M1392 502 H1450" class="arr"/><g transform="translate(1450 445)"><rect width="290" height="115" class="box green"/><text x="145" y="27" text-anchor="middle" class="h">进入下一层</text><text x="145" y="56" text-anchor="middle" class="m">Xˡ⁺¹ → layer l+1</text><text x="145" y="82" text-anchor="middle" class="s">重复至第 30 层</text><text x="145" y="103" text-anchor="middle" class="s">最终只返回 30 份 cache</text></g>
  <path d="M1595 445 V385 H1020" class="dash"/><text x="1280" y="370" text-anchor="middle" class="s">下一层使用更新后的 hidden 重新计算新的 K/V</text>
  <rect x="48" y="597" width="1692" height="80" rx="10" class="warn"/><text x="70" y="627" class="h">关键纠正</text><text x="70" y="654" class="t">所谓“完整跑 30 层 VideoDiT”是指所有 Transformer blocks 都执行；但 prefill_video_cache 不调用 video_expert.post_dit()，因此没有 output head、unpatchify、velocity 输出或 scheduler update。</text>

  <rect x="24" y="726" width="1752" height="278" rx="16" class="box"/><text x="48" y="760" class="h">C. 第 i 个 action 去噪步如何逐层消费同一份 video cache？</text>
  <g transform="translate(48 794)"><rect width="210" height="142" class="box purple"/><text x="105" y="27" text-anchor="middle" class="h">Action 层输入 Aᵢˡ</text><text x="105" y="56" text-anchor="middle" class="m">[B,32,1024]</text><text x="105" y="84" text-anchor="middle" class="s">AdaLN(tₐ=σᵢ)</text><text x="105" y="110" text-anchor="middle" class="s">Qₐˡ,Kₐˡ,Vₐˡ + 1D RoPE</text></g>
  <path d="M258 865 H310" class="arr"/><g transform="translate(310 794)"><rect width="245" height="142" class="box cache"/><text x="122" y="27" text-anchor="middle" class="h">读取 cache[l]</text><text x="122" y="57" text-anchor="middle" class="m">Kᵥˡ,Vᵥˡ</text><text x="122" y="84" text-anchor="middle" class="s">所有 action timestep 共用</text><text x="122" y="110" text-anchor="middle" class="s">无需重新运行 VideoDiT</text></g>
  <path d="M555 865 H607" class="arr"/><g transform="translate(607 784)"><rect width="300" height="162" class="box orange"/><text x="150" y="27" text-anchor="middle" class="h">拼接 Keys / Values</text><text x="150" y="60" text-anchor="middle" class="m">Kcat=[Kᵥˡ ; Kₐˡ]</text><text x="150" y="89" text-anchor="middle" class="m">Vcat=[Vᵥˡ ; Vₐˡ]</text><text x="150" y="118" text-anchor="middle" class="s">query 只有 action Qₐˡ</text><text x="150" y="142" text-anchor="middle" class="s">action 可见 video condition + actions</text></g>
  <path d="M907 865 H959" class="arr"/><g transform="translate(959 784)"><rect width="300" height="162" class="box purple"/><text x="150" y="27" text-anchor="middle" class="h">Mixed Attention + Action post</text><text x="150" y="58" text-anchor="middle" class="m">Attn(Qₐˡ,Kcat,Vcat)</text><text x="150" y="87" text-anchor="middle" class="s">output projection / residual</text><text x="150" y="113" text-anchor="middle" class="s">text cross-attn / FFN</text><text x="150" y="139" text-anchor="middle" class="m">Aᵢˡ⁺¹</text></g>
  <path d="M1259 865 H1311" class="arr"/><g transform="translate(1311 784)"><rect width="210" height="162" class="box purple"/><text x="105" y="27" text-anchor="middle" class="h">30 层后 Action Head</text><text x="105" y="61" text-anchor="middle" class="s">预测 velocity vₐ</text><text x="105" y="91" text-anchor="middle" class="s">scheduler step</text><text x="105" y="121" text-anchor="middle" class="m">aᵢ → aᵢ₊₁</text><text x="105" y="145" text-anchor="middle" class="s">重复 Nₐ 次</text></g>
  <path d="M1521 865 H1573" class="arr"/><g transform="translate(1573 804)"><rect width="167" height="122" class="box green"/><text x="83" y="27" text-anchor="middle" class="h">最终 Action</text><text x="83" y="60" text-anchor="middle" class="m">[32,dₐ]</text><text x="83" y="88" text-anchor="middle" class="s">滚动执行若干步</text></g>
  <text x="900" y="1029" text-anchor="middle" class="s">Base 与 IDM 的 action-cache 读取代码相同；区别只在 cache 承载 98 个真实 f₀ tokens，还是 294 个“真实 f₀ + imagined future”tokens。</text>
</svg>
