<title>Wan2.2 单个 14B Expert 内部数据流与维度</title>
<metadata>task=wan22-moe-cfg-svg-redesign; generated=2026-08-06; source_commit=42bf4cfaa384bc21833865abc2f9e6c0e67233dc; diagram=expert-internal</metadata>
<defs><linearGradient id='h' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#10172C'/><stop offset='1' stop-color='#334E86'/></linearGradient><marker id='a' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0 0L12 6 0 12Z' fill='#315FC2'/></marker><marker id='g' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0 0L12 6 0 12Z' fill='#16835B'/></marker><style>.t{font-family:Arial,sans-serif;fill:#14213D}.title{font-size:34px;font-weight:800;fill:white}.sub{font-size:16px;fill:#DCE8FF}.sec{font-size:20px;font-weight:800;fill:#213F74}.lab{font-size:17px;font-weight:750}.body{font-size:14px}.sm{font-size:12px;fill:#5D6B82}.dim{font-family:Consolas,monospace;font-size:12px;fill:#23437A}.c{text-anchor:middle}.box{fill:white;stroke:#B4C5E7;stroke-width:2}.video{fill:#EAF2FF;stroke:#4E79D9;stroke-width:2}.text{fill:#FFF8E7;stroke:#E2B94E;stroke-width:2}.time{fill:#F1EAFF;stroke:#8466CC;stroke-width:2}.block{fill:#F8FAFF;stroke:#7E9CD7;stroke-width:2}.head{fill:#E9F8F3;stroke:#2D9B76;stroke-width:2}.ln{fill:none;stroke:#315FC2;stroke-width:3;marker-end:url(#a)}.green{fill:none;stroke:#16835B;stroke-width:3;marker-end:url(#g)}.dash{fill:none;stroke:#8466CC;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}</style></defs>
<rect width='1900' height='1260' fill='#F2F6FC'/><rect width='1900' height='112' fill='url(#h)'/>
<text class='t title' x='64' y='54'>Selected Wan Expert · 14B DiT 内部数据流</text><text class='t sub' x='66' y='86'>40 layers · dim 5120 · 40 heads · FFN 13824 · positive/negative 前向仅替换文本 context</text>
<rect width='1900' height='1260' fill='#F2F6FC'/><rect width='1900' height='112' fill='url(#h)'/>
<text class='t title' x='64' y='54'>Selected Wan Expert · 14B DiT 内部数据流</text>
<text class='t sub' x='66' y='86'>40 layers · dim 5120 · 40 heads · FFN 13824 · 正向/负向前向只替换文本 context</text>

<rect class='box' x='40' y='140' width='500' height='470' rx='22'/>
<text class='t sec' x='64' y='177'>A. 视频 latent 路径</text>
<text class='t sm' x='64' y='201'>先把时空网格压成 Transformer token 序列</text>
<rect class='video' x='64' y='226' width='188' height='70' rx='14'/>
<text class='t lab c' x='158' y='255'>x_t</text><text class='t dim c' x='158' y='279'>[B,16,21,90,160]</text>
<rect class='video' x='328' y='226' width='188' height='70' rx='14'/>
<text class='t lab c' x='422' y='255'>可选 y（I2V）</text><text class='t dim c' x='422' y='279'>[B,20,21,90,160]</text>
<path class='ln' d='M252 261H314'/><path class='dash' d='M422 296V326H280'/>
<rect class='video' x='64' y='336' width='452' height='76' rx='14'/>
<text class='t lab c' x='290' y='367'>cat(x_t, y) 或直接使用 x_t</text><text class='t dim c' x='290' y='392'>I2V: [B,36,21,90,160] · T2V: [B,16,21,90,160]</text>
<path class='ln' d='M290 412V438'/>
<rect class='video' x='64' y='448' width='452' height='72' rx='14'/>
<text class='t lab c' x='290' y='478'>Conv3D Patch Embedding</text><text class='t dim c' x='290' y='502'>kernel=stride=(1,2,2) → [B,5120,21,45,80]</text>
<path class='ln' d='M290 520V546'/>
<rect class='video' x='64' y='556' width='452' height='40' rx='12'/>
<text class='t dim c' x='290' y='582'>flatten(2).transpose(1,2) → h₀ [B,L,5120], L=21×45×80=75,600</text>

<rect class='box' x='570' y='140' width='610' height='255' rx='22'/>
<text class='t sec' x='594' y='177'>B. 时间条件路</text>
<text class='t sm' x='594' y='201'>一个标量 t 被广播到每个 token，产生六组 AdaLN 控制量</text>
<rect class='time' x='594' y='232' width='105' height='67' rx='13'/><text class='t lab c' x='646' y='260'>t</text><text class='t dim c' x='646' y='282'>[B] 或 [B,L]</text>
<path class='ln' d='M699 266H728'/>
<rect class='time' x='728' y='232' width='150' height='67' rx='13'/><text class='t lab c' x='803' y='259'>sinusoidal</text><text class='t dim c' x='803' y='282'>freq_dim=256</text>
<path class='ln' d='M878 266H907'/>
<rect class='time' x='907' y='232' width='128' height='67' rx='13'/><text class='t lab c' x='971' y='259'>MLP</text><text class='t dim c' x='971' y='282'>256→5120</text>
<path class='ln' d='M1035 266H1064'/>
<rect class='time' x='1064' y='218' width='92' height='95' rx='13'/><text class='t lab c' x='1110' y='249'>×6</text><text class='t dim c' x='1110' y='273'>shift</text><text class='t dim c' x='1110' y='293'>scale</text><text class='t dim c' x='1110' y='313'>gate</text>
<path class='dash' d='M1110 313V421'/>
<text class='t sm' x='594' y='350'>e₀ = [shift₁, scale₁, gate₁, shift₂, scale₂, gate₂]</text>
<text class='t dim' x='594' y='374'>broadcast / unflatten → [B,L,6,5120]</text>

<rect class='box' x='1210' y='140' width='650' height='255' rx='22'/>
<text class='t sec' x='1234' y='177'>C. 文本条件路（Cross-Attention 的 K/V）</text>
<rect class='text' x='1234' y='223' width='205' height='72' rx='13'/><text class='t lab c' x='1336' y='253'>UMT5 context</text><text class='t dim c' x='1336' y='278'>[B,≤512,4096]</text>
<path class='ln' d='M1439 259H1470'/>
<rect class='text' x='1470' y='223' width='176' height='72' rx='13'/><text class='t lab c' x='1558' y='253'>text_embedding</text><text class='t dim c' x='1558' y='278'>4096→5120</text>
<path class='ln' d='M1646 259H1677'/>
<rect class='text' x='1677' y='209' width='158' height='100' rx='13'/><text class='t lab c' x='1756' y='243'>K / V</text><text class='t dim c' x='1756' y='268'>[B,≤512,5120]</text><text class='t sm c' x='1756' y='291'>pos 或 neg</text>
<path class='dash' d='M1756 309V709H1450'/>
<text class='t sm' x='1234' y='349'>positive / negative 两次调用共享 x_t、t、y、Expert 权重；只换这条 context</text>
<text class='t sm' x='1234' y='374'>Q 来自视频 token；K/V 来自文本 token。context_lens 负责有效长度。</text>

<rect class='block' x='570' y='435' width='1290' height='520' rx='24'/>
<text class='t sec' x='596' y='473'>D. WanAttentionBlock（下面这一块重复 40 次）</text>
<text class='t sm' x='596' y='497'>核心思想：每一层都用时间条件调制归一化，再依次做空间/时间建模、文本对齐和局部细节修正。</text>

<rect class='video' x='596' y='535' width='126' height='66' rx='12'/><text class='t lab c' x='659' y='563'>h₀</text><text class='t dim c' x='659' y='586'>[B,L,5120]</text>
<path class='ln' d='M722 568H748'/>
<rect class='block' x='748' y='535' width='150' height='66' rx='12'/><text class='t lab c' x='823' y='562'>AdaLN-1</text><text class='t sm c' x='823' y='585'>shift₁ / scale₁</text>
<path class='ln' d='M898 568H927'/>
<rect class='block' x='927' y='523' width='198' height='90' rx='12'/><text class='t lab c' x='1026' y='555'>Self-Attention</text><text class='t dim c' x='1026' y='578'>40 heads × 128 = 5120</text><text class='t sm c' x='1026' y='598'>3D RoPE · Q/K/V from h</text>
<path class='ln' d='M1125 568H1154'/>
<rect class='block' x='1154' y='535' width='154' height='66' rx='12'/><text class='t lab c' x='1231' y='562'>gate₁ ⊙ y</text><text class='t sm c' x='1231' y='585'>h ← h + …</text>
<path class='ln' d='M1308 568H1340V675H728V709'/>
<text class='t sm' x='1190' y='650'>残差 ①</text>

<rect class='block' x='728' y='675' width='190' height='72' rx='12'/><text class='t lab c' x='823' y='705'>Cross-Attention</text><text class='t sm c' x='823' y='728'>Q=h · K/V=context</text>
<path class='ln' d='M918 711H949'/>
<rect class='block' x='949' y='675' width='145' height='72' rx='12'/><text class='t lab c' x='1021' y='705'>AdaLN-2</text><text class='t sm c' x='1021' y='728'>shift₂ / scale₂</text>
<path class='ln' d='M1094 711H1125'/>
<rect class='block' x='1125' y='663' width='232' height='96' rx='12'/><text class='t lab c' x='1241' y='697'>FFN（GELU-tanh）</text><text class='t dim c' x='1241' y='720'>5120 → 13824 → 5120</text><text class='t sm c' x='1241' y='743'>逐 token 的非线性变换</text>
<path class='ln' d='M1357 711H1388'/>
<rect class='block' x='1388' y='675' width='154' height='72' rx='12'/><text class='t lab c' x='1465' y='705'>gate₂ ⊙ y</text><text class='t sm c' x='1465' y='728'>h ← h + …</text>
<path class='ln' d='M1542 711H1580'/>
<rect class='video' x='1580' y='675' width='228' height='72' rx='12'/><text class='t lab c' x='1694' y='705'>h_out</text><text class='t dim c' x='1694' y='728'>[B,L,5120]</text>
<path class='dash' d='M659 601V842H1694V747'/>
<text class='t sm' x='596' y='812'>每层的 e₀ 由当前 timestep 产生；gate 控制两个残差支路“写回”多少。</text>
<rect class='time' x='596' y='842' width='420' height='77' rx='13'/><text class='t lab' x='618' y='872'>时间调制注入点</text><text class='t dim' x='618' y='898'>norm(x)·(1+scaleᵢ)+shiftᵢ；branch·gateᵢ</text>
<rect class='text' x='1042' y='842' width='766' height='77' rx='13'/><text class='t lab' x='1064' y='872'>为什么正/负向各跑一次？</text><text class='t sm' x='1064' y='898'>同一个 h₀ 和同一个 t 进入同一 Expert；只有 Cross-Attention 读取的文本 K/V 不同。</text>

<rect class='head' x='40' y='655' width='500' height='300' rx='22'/>
<text class='t sec' x='64' y='692'>E. 输出头：token 还原回 latent</text>
<rect class='head' x='64' y='720' width='452' height='74' rx='13'/><text class='t lab c' x='290' y='750'>Head</text><text class='t dim c' x='290' y='775'>AdaLN(e) + Linear(5120 → 64)</text>
<path class='ln' d='M290 794V821'/>
<rect class='head' x='64' y='821' width='452' height='74' rx='13'/><text class='t lab c' x='290' y='851'>Unpatchify</text><text class='t dim c' x='290' y='876'>64 = 16 × 1 × 2 × 2</text>
<path class='green' d='M540 805H570V878H540'/>
<text class='t sm' x='64' y='927'>Expert 分支最终输出是速度/噪声参数化下的 latent 预测，不是 RGB 视频。</text>

<rect class='box' x='570' y='985' width='1290' height='225' rx='22'/>
<text class='t sec' x='596' y='1023'>F. 从一层到完整 Expert：尺寸和调用边界</text>
<text class='t body' x='596' y='1060'>• 输入：x_t（以及 I2V 的 y）与 t、文本 context；中间 token 始终保持 [B,L,5120]。</text>
<text class='t body' x='596' y='1089'>• 深度：40 个 WanAttentionBlock 串联；每层都重复 Self-Attn → Cross-Attn → FFN。</text>
<text class='t body' x='596' y='1118'>• Expert 边界：MoE 只在完整 Expert 之间切换，不在 block 内逐 token 选专家；High/Low 的权重不混合。</text>
<text class='t body' x='596' y='1147'>• CFG 边界：正向/负向两次 forward 得到 v_pos、v_neg，离开 Expert 后才合并成 v_cfg，再交给 UniPC/DPM++。</text>
<rect class='time' x='1450' y='1060' width='358' height='105' rx='14'/><text class='t lab c' x='1629' y='1092'>一句话记忆</text><text class='t sm c' x='1629' y='1120'>同一个“画师”（Expert）</text><text class='t sm c' x='1629' y='1144'>看同一张草稿 h₀，</text><text class='t sm c' x='1629' y='1164'>只换文字指令。</text>
</svg>
