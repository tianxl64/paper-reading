<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1040' viewBox='0 0 1600 1040'>
<title>Fast-WAM training and inference compatibility</title><defs><linearGradient id='bg' x2='1' y2='1'><stop stop-color='#071426'/><stop offset='1' stop-color='#15294a'/></linearGradient><linearGradient id='tr'><stop stop-color='#1d4ed8'/><stop offset='1' stop-color='#7c3aed'/></linearGradient><linearGradient id='inf'><stop stop-color='#047857'/><stop offset='1' stop-color='#0891b2'/></linearGradient><filter id='sh'><feDropShadow dx='0' dy='7' stdDeviation='9' flood-opacity='.3'/></filter><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#67e8f9'/></marker><marker id='g' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#34d399'/></marker><style>text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif}.T{font-size:37px;font-weight:800;fill:#f8fafc}.S{font-size:16px;fill:#b9c9dd}.H{font-size:24px;font-weight:800;fill:#fff}.C{font-size:19px;font-weight:800;fill:#fff}.B{font-size:15px;fill:#dbeafe}.N{font-size:13px;fill:#adc0d6}.K{font-size:13px;font-weight:800;fill:#fff}.M{font-family:'Cascadia Mono',Consolas,monospace;font-size:13px;fill:#dbeafe}.D{font-size:22px;font-weight:900;fill:#fef3c7}</style></defs><rect width='1600' height='1040' rx='30' fill='url(#bg)'/><text x='62' y='64' class='T'>Fast-WAM：训练有 noisy future video，推理删掉它，为什么 action 仍然兼容？</text><text x='62' y='96' class='S'>答案不是只靠 RoPE，而是把 action 所依赖的 token 设计成一个对 future-video 节点封闭的因果子图；推理只是安全地裁剪不可达节点。</text>
<g transform='translate(54 126)'><rect width='1492' height='305' rx='24' fill='#12254a' stroke='#4f46e5' stroke-width='2'/><rect width='240' height='305' rx='24' fill='url(#tr)'/><text x='25' y='48' class='H'>A. Training graph</text><text x='25' y='82' class='B'>完整序列：</text><text x='25' y='111' class='M'>[ F0 | F+ | Aᵗ ]</text><text x='25' y='153' class='B'>F0：clean first frame</text><text x='25' y='178' class='B'>F+：noisy future video</text><text x='25' y='203' class='B'>Aᵗ：noisy action chunk</text><text x='25' y='251' class='N'>虚线表示被 mask 禁止。</text>
<g transform='translate(275 26)' filter='url(#sh)'><rect width='1190' height='253' rx='18' fill='#172f59' stroke='#6366f1'/><rect x='35' y='43' width='184' height='48' rx='11' fill='#0e7490'/><text x='74' y='73' class='K'>F0 clean visual anchor</text><rect x='425' y='43' width='194' height='48' rx='11' fill='#2563eb'/><text x='458' y='73' class='K'>F+ noisy future video</text><rect x='860' y='43' width='190' height='48' rx='11' fill='#ef4444'/><text x='898' y='73' class='K'>Aᵗ noisy action</text>
<path d='M221 66H417' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><text x='276' y='54' class='N'>future query reads F0</text><path d='M852 66H627' stroke='#fb7185' stroke-width='3' stroke-dasharray='7 6'/><text x='670' y='53' class='N'>A→F+ forbidden</text><path d='M852 78H227' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><text x='572' y='106' class='B'>Action queries can read only F0 and action tokens</text><path d='M217 101C310 175 384 175 423 101' fill='none' stroke='#fb7185' stroke-width='2' stroke-dasharray='7 6'/><text x='243' y='194' class='N'>F0→F+ forbidden：F0 itself cannot absorb future information</text><path d='M1050 101C1013 169 904 169 860 101' fill='none' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/><text x='905' y='194' class='N'>A↔A bidirectional</text><text x='35' y='230' class='M'>Mask rows: F0→F0 | F+→F0,F+ | A→F0,A</text></g></g>
<g transform='translate(54 456)'><rect width='1492' height='254' rx='24' fill='#0d3439' stroke='#10b981' stroke-width='2'/><rect width='240' height='254' rx='24' fill='url(#inf)'/><text x='25' y='48' class='H'>B. Inference graph</text><text x='25' y='82' class='B'>裁剪 F+ 后：</text><text x='25' y='111' class='M'>[ F0 | Aᵗ ]</text><text x='25' y='159' class='B'>F0 先 prefill 一次，</text><text x='25' y='184' class='B'>每层 K/V 被缓存；</text><text x='25' y='209' class='B'>Aᵗ 每步重新计算。</text>
<g transform='translate(275 23)' filter='url(#sh)'><rect width='1190' height='207' rx='18' fill='#12434a' stroke='#34d399'/><rect x='38' y='38' width='204' height='48' rx='11' fill='#0e7490'/><text x='79' y='68' class='K'>F0 prefill at t=0</text><rect x='383' y='38' width='188' height='48' rx='11' fill='#047857'/><text x='419' y='68' class='K'>per-layer K/V cache</text><rect x='765' y='38' width='215' height='48' rx='11' fill='#ef4444'/><text x='798' y='68' class='K'>Aᵗ action denoising</text><path d='M245 62H375' stroke='#34d399' stroke-width='4' marker-end='url(#g)'/><path d='M573 62H757' stroke='#34d399' stroke-width='4' marker-end='url(#g)'/><path d='M980 96C945 155 805 155 770 96' fill='none' stroke='#67e8f9' stroke-width='3' marker-end='url(#a)'/>
<text x='38' y='127' class='D'>Induced-subgraph equivalence</text><text x='38' y='156' class='B'>训练图中 F0 与 A 的更新从来不依赖 F+；删掉 F+ 不会改变它们的 attention softmax、残差、FFN 或 cross-attention。</text><text x='38' y='183' class='N'>源码还用相同 seed 比较 infer_joint 与 infer_action，超过 atol/rtol=1e-2 会报警。</text></g></g>
<g transform='translate(54 735)'><text x='0' y='28' class='H'>C. 不只 RoPE：八个共同保证兼容的机制</text>
<g transform='translate(0 52)'><rect width='350' height='88' rx='15' fill='#19365c' stroke='#38bdf8'/><text x='18' y='29' class='C'>1. Causal VAE</text><text x='18' y='55' class='N'>训练整段视频的首 latent 与推理单帧编码同源；</text><text x='18' y='75' class='N'>VAE 首段只处理第一帧，不读取未来。</text></g>
<g transform='translate(370 52)'><rect width='350' height='88' rx='15' fill='#19365c' stroke='#38bdf8'/><text x='18' y='29' class='C'>2. Per-token timestep</text><text x='18' y='55' class='N'>训练强制 F0 timestep=0，F+ 使用 sampled t；</text><text x='18' y='75' class='N'>推理 F0 同样以 t=0 prefill。</text></g>
<g transform='translate(740 52)'><rect width='350' height='88' rx='15' fill='#19365c' stroke='#38bdf8'/><text x='18' y='29' class='C'>3. Expert-local RoPE</text><text x='18' y='55' class='N'>F0 始终是 video temporal index 0；action</text><text x='18' y='75' class='N'>独立 1D RoPE 从 0 开始，不被 video 长度平移。</text></g>
<g transform='translate(1110 52)'><rect width='382' height='88' rx='15' fill='#19365c' stroke='#38bdf8'/><text x='18' y='29' class='C'>4. Dynamic structured mask</text><text x='18' y='55' class='N'>按当前 Sv、Sa 重建 mask；action 始终只开放</text><text x='18' y='75' class='N'>F0 列与 action 列，future 列始终为 false。</text></g>
<g transform='translate(0 157)'><rect width='350' height='88' rx='15' fill='#263554' stroke='#a78bfa'/><text x='18' y='29' class='C'>5. Separate experts</text><text x='18' y='55' class='N'>video/action 各有 Norm、AdaLN、QKV、FFN、head；</text><text x='18' y='75' class='N'>删除 F+ 不改变 action 参数接口。</text></g>
<g transform='translate(370 157)'><rect width='350' height='88' rx='15' fill='#263554' stroke='#a78bfa'/><text x='18' y='29' class='C'>6. Common attention width</text><text x='18' y='55' class='N'>两 expert hidden 可为 3072 / 1024，但 QKV 都投影到</text><text x='18' y='75' class='N'>24×128=3072，mixed attention 后各自 o-proj。</text></g>
<g transform='translate(740 157)'><rect width='350' height='88' rx='15' fill='#263554' stroke='#a78bfa'/><text x='18' y='29' class='C'>7. Token-wise operations</text><text x='18' y='55' class='N'>RMSNorm、FFN、residual、cross-attention 无 BatchNorm；</text><text x='18' y='75' class='N'>不会因 sequence 变短改变统计量。</text></g>
<g transform='translate(1110 157)'><rect width='382' height='88' rx='15' fill='#4b2e2b' stroke='#fb923c'/><text x='18' y='29' class='C'>8. Loss slicing + co-training</text><text x='18' y='55' class='N'>F0 不计算 video denoise loss；F+ loss 只通过参数学习</text><text x='18' y='75' class='N'>塑造 F0 world representation，而非样本级泄漏。</text></g></g>
<rect x='54' y='1000' width='1492' height='26' rx='13' fill='#5b241f'/><text x='75' y='1018' class='N'>代码注意：当前 release 的通用 infer() 仍调用 infer_joint() 生成视频用于评估；要获得论文所述低延迟路径，应调用 infer_action()。</text>
</svg>
