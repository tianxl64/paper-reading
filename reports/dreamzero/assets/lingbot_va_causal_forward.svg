<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='980' viewBox='0 0 1600 980'>
<title>LingBot-VA paper and released-code causal forward</title><defs><linearGradient id='bg' x2='1' y2='1'><stop stop-color='#07111f'/><stop offset='1' stop-color='#172554'/></linearGradient><linearGradient id='top'><stop stop-color='#4338ca'/><stop offset='1' stop-color='#a21caf'/></linearGradient><linearGradient id='bot'><stop stop-color='#0369a1'/><stop offset='1' stop-color='#0891b2'/></linearGradient><filter id='sh'><feDropShadow dx='0' dy='7' stdDeviation='9' flood-opacity='.3'/></filter><marker id='a' markerWidth='11' markerHeight='11' refX='9' refY='5.5' orient='auto'><path d='M0 0L11 5.5L0 11Z' fill='#e879f9'/></marker><marker id='c' markerWidth='11' markerHeight='11' refX='9' refY='5.5' orient='auto'><path d='M0 0L11 5.5L0 11Z' fill='#67e8f9'/></marker><style>text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif}.T{font-size:37px;font-weight:800;fill:#f8fafc}.S{font-size:16px;fill:#b8c8dc}.H{font-size:24px;font-weight:800;fill:#fff}.C{font-size:19px;font-weight:800;fill:#fff}.B{font-size:15px;fill:#dbeafe}.N{font-size:13px;fill:#b7c7dc}.K{font-size:13px;font-weight:800;fill:#fff}.P{font-family:'Cascadia Mono',Consolas,monospace;font-size:13px;fill:#dbeafe}</style></defs><rect width='1600' height='980' rx='30' fill='url(#bg)'/><text x='62' y='64' class='T'>LingBot-VA：论文拓扑、发布代码与真实因果执行顺序</text><text x='62' y='96' class='S'>最重要的结论：算法顺序是 videoₖ → actionₖ；但论文描述 dual-stream MoT，官方当前 release 则实现一套共享 Wan blocks。</text>
<g transform='translate(55 125)'><rect width='1490' height='232' rx='24' fill='#211b52' stroke='#8b5cf6' stroke-width='2'/><rect width='244' height='232' rx='24' fill='url(#top)'/><text x='25' y='48' class='H'>A. 模型拓扑</text><text x='25' y='82' class='B'>同一算法思想，</text><text x='25' y='107' class='B'>论文与 release 的</text><text x='25' y='132' class='B'>参数共享方式不同。</text>
<g transform='translate(278 22)' filter='url(#sh)'><rect width='560' height='188' rx='18' fill='#302767' stroke='#c084fc'/><text x='20' y='36' class='C'>论文：dual-stream Mixture-of-Transformers</text><rect x='26' y='63' width='176' height='43' rx='10' fill='#2563eb'/><text x='50' y='90' class='K'>Video Transformer blocks</text><rect x='356' y='63' width='178' height='43' rx='10' fill='#ef4444'/><text x='376' y='90' class='K'>Action Transformer blocks</text><path d='M205 80H348' stroke='#e879f9' stroke-width='3' marker-end='url(#a)'/><path d='M350 96H207' stroke='#e879f9' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#a)'/><text x='22' y='136' class='B'>每种模态有独立 blocks；中间 attention 融合 token 信息。</text><text x='22' y='163' class='N'>信息可以交互，不代表 QKV / FFN / Norm 参数 tying。</text></g>
<g transform='translate(865 22)' filter='url(#sh)'><rect width='600' height='188' rx='18' fill='#302767' stroke='#c084fc'/><text x='20' y='36' class='C'>官方 release：一个 WanTransformer3DModel</text><rect x='25' y='60' width='124' height='42' rx='10' fill='#2563eb'/><text x='48' y='86' class='K'>video stem</text><rect x='190' y='60' width='214' height='42' rx='10' fill='#7c3aed'/><text x='224' y='86' class='K'>30 shared Wan blocks</text><rect x='445' y='60' width='130' height='42' rx='10' fill='#ef4444'/><text x='467' y='86' class='K'>action head</text><path d='M151 81H182' stroke='#e879f9' stroke-width='3' marker-end='url(#a)'/><path d='M406 81H437' stroke='#e879f9' stroke-width='3' marker-end='url(#a)'/><text x='22' y='136' class='B'>共享 Self-Attn Q/K/V/O、Cross-Attn、FFN、Norm。</text><text x='22' y='163' class='N'>专属：输入 stem、输出 head、action condition embedder 副本。</text></g></g>
<g transform='translate(55 382)'><rect width='1490' height='270' rx='24' fill='#0d2942' stroke='#0ea5e9' stroke-width='2'/><rect width='244' height='270' rx='24' fill='url(#bot)'/><text x='25' y='48' class='H'>B. 训练 mask</text><text x='25' y='82' class='B'>拼接顺序：</text><text x='25' y='111' class='P'>[noisy V, clean V,</text><text x='25' y='136' class='P'> noisy A, clean A]</text><text x='25' y='180' class='B'>video block 偶数，</text><text x='25' y='205' class='B'>action block 奇数。</text>
<g transform='translate(278 25)'><rect x='0' y='0' width='220' height='54' rx='12' fill='#2563eb'/><text x='51' y='33' class='K'>noisy video Vₖᵗ</text><rect x='300' y='0' width='220' height='54' rx='12' fill='#0e7490'/><text x='349' y='33' class='K'>clean video Vₖ</text><rect x='600' y='0' width='220' height='54' rx='12' fill='#ef4444'/><text x='646' y='33' class='K'>noisy action Aₖᵗ</text><rect x='900' y='0' width='220' height='54' rx='12' fill='#9f1239'/><text x='945' y='33' class='K'>clean action Aₖ</text>
<text x='8' y='87' class='P'>block = 2k</text><text x='308' y='87' class='P'>block = 2k</text><text x='608' y='87' class='P'>block = 2k+1</text><text x='908' y='87' class='P'>block = 2k+1</text>
<path d='M710 105C710 154 460 154 410 65' fill='none' stroke='#67e8f9' stroke-width='4' marker-end='url(#c)'/><text x='470' y='143' class='B'>关键边：noisy Aₖ 可以读取同 chunk 的 clean Vₖ</text><path d='M110 104V185H1040' fill='none' stroke='#60a5fa' stroke-width='2' stroke-dasharray='7 6'/><text x='14' y='219' class='N'>noisy query：可看更早 clean blocks + 当前 noisy block；不可看当前 clean target。clean query：只看不晚于自己的 clean blocks。</text></g></g>
<g transform='translate(55 678)'><rect width='1490' height='245' rx='24' fill='#261c3f' stroke='#d946ef' stroke-width='2'/><text x='28' y='43' class='H'>C. 推理：严格两阶段异步生成，最后一步才把 clean K/V 固化到每层 cache</text>
<g transform='translate(30 70)' filter='url(#sh)'><rect width='260' height='115' rx='16' fill='#1e3a5f' stroke='#38bdf8'/><text x='18' y='31' class='C'>历史 cache</text><text x='18' y='59' class='P'>V₀,A₀,...,Vₖ₋₁,Aₖ₋₁</text><text x='18' y='87' class='N'>滑动窗口；每层独立 K/V</text></g><path d='M295 127H355' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/>
<g transform='translate(365 58)' filter='url(#sh)'><rect width='295' height='142' rx='16' fill='#163b69' stroke='#38bdf8'/><text x='18' y='31' class='C'>1. Video denoising loop</text><text x='18' y='60' class='P'>zᵗ → shared blocks → vθ</text><text x='18' y='88' class='B'>多步 FlowMatch + video CFG</text><text x='18' y='116' class='N'>最终 t=0, update_cache=1</text></g><path d='M664 127H724' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/>
<g transform='translate(734 70)' filter='url(#sh)'><rect width='205' height='115' rx='16' fill='#5b21b6' stroke='#c084fc'/><text x='18' y='31' class='C'>固化 clean Vₖ K/V</text><text x='18' y='62' class='B'>动作阶段直接读取</text><text x='18' y='88' class='N'>不重复算历史 video</text></g><path d='M943 127H1003' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/>
<g transform='translate(1013 58)' filter='url(#sh)'><rect width='300' height='142' rx='16' fill='#64203b' stroke='#fb7185'/><text x='18' y='31' class='C'>2. Action denoising loop</text><text x='18' y='60' class='P'>aᵗ + cached Vₖ → uθ</text><text x='18' y='88' class='B'>多步 FlowMatch；可独立 CFG</text><text x='18' y='116' class='N'>最终 t=0 固化 clean Aₖ K/V</text></g><path d='M1317 127H1372' stroke='#e879f9' stroke-width='4' marker-end='url(#a)'/><rect x='1382' y='78' width='78' height='96' rx='14' fill='#0f766e'/><text x='1396' y='111' class='K'>next</text><text x='1398' y='137' class='K'>chunk</text>
<text x='30' y='226' class='N'>因此：跨 chunk 是 AR；chunk 内不是逐 patch/token AR。训练时 Aₖ 读取 GT Vₖ，推理时 Aₖ 读取模型生成 Vₖ，形成 teacher-forcing / exposure-bias 差异。</text></g>
</svg>
