<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <linearGradient id="baseHead" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#123b73"/><stop offset="1" stop-color="#2467a8"/></linearGradient>
    <linearGradient id="idmHead" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#075c63"/><stop offset="1" stop-color="#15939a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:white}.lane{fill:white;stroke-width:2}.box{fill:white;stroke:#7d98b5;stroke-width:1.7;rx:14}.base{stroke:#2e69a5}.idm{stroke:#14838b}.bfill{fill:#edf6ff}.ifill{fill:#ebfbf8}.purple{fill:#f3efff;stroke:#7857b2}.orange{fill:#fff5e7;stroke:#c98219}.cache{fill:#eef8ff;stroke:#2581b9}.note{fill:#fffbea;stroke:#b48b24}.txt{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172033}.small{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.h{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#13233c}.mono{font:14px Consolas,monospace;fill:#14213d}.strong{font-weight:700}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="900" y="40" text-anchor="middle" class="h" style="font-size:27px">Fast-WAM Base 与 Fast-WAM-IDM：t=0 VideoDiT Prefill 完整数据流</text>

  <rect x="24" y="62" width="1752" height="420" rx="18" class="lane base"/><rect x="24" y="62" width="1752" height="54" rx="18" fill="url(#baseHead)"/>
  <text x="50" y="98" class="title">FAST-WAM BASE：只编码当前观测，不生成未来视频</text>

  <g transform="translate(48 142)"><rect width="170" height="135" class="box bfill"/><text x="85" y="27" text-anchor="middle" class="h">① 当前观测</text><text x="85" y="61" text-anchor="middle" class="mono">RGB [1,3,224,448]</text><text x="85" y="91" text-anchor="middle" class="small">LIBERO 双相机横向拼接</text><text x="85" y="116" text-anchor="middle" class="small">真实传感器数据</text></g>
  <path d="M218 210 H250" class="arrow"/>
  <g transform="translate(250 142)"><rect width="190" height="135" class="box bfill"/><text x="95" y="27" text-anchor="middle" class="h">② Wan VAE38</text><text x="95" y="54" text-anchor="middle" class="small">冻结 · causal · 空间压缩 16×</text><text x="95" y="82" text-anchor="middle" class="mono">f₀ [1,48,1,14,28]</text><text x="95" y="110" text-anchor="middle" class="small">干净首帧 latent</text></g>
  <path d="M440 210 H472" class="arrow"/>
  <g transform="translate(472 132)"><rect width="238" height="155" class="box orange"/><text x="119" y="28" text-anchor="middle" class="h">③ Video pre_dit，tᵥ=0</text><text x="15" y="58" class="small">• Conv3D patch=(1,2,2)</text><text x="15" y="82" class="small">• 14×28 → 7×14</text><text x="15" y="106" class="mono">98 tokens × Dᵥ=3072</text><text x="15" y="130" class="small">• 3D RoPE + t=0 AdaLN 调制</text></g>
  <path d="M710 210 H742" class="arrow"/>
  <g transform="translate(742 126)"><rect width="340" height="168" class="box base"/><text x="170" y="28" text-anchor="middle" class="h">④ t=0 VideoDiT Prefill：30 层，仅一次</text><text x="18" y="61" class="small">每层：AdaLN → Qᵥ/Kᵥ/Vᵥ+RoPE → 空间 Self-Attn</text><text x="18" y="87" class="small">→ gated residual → 文本 Cross-Attn → FFN → 下一层</text><rect x="18" y="108" width="304" height="42" rx="8" class="note"/><text x="170" y="126" text-anchor="middle" class="small strong">不执行 video output head</text><text x="170" y="144" text-anchor="middle" class="small strong">不执行 scheduler step / VAE decode</text></g>
  <path d="M1082 210 H1114" class="arrow"/>
  <g transform="translate(1114 132)"><rect width="190" height="155" class="box cache"/><text x="95" y="28" text-anchor="middle" class="h">⑤ 逐层 KV Cache</text><text x="95" y="58" text-anchor="middle" class="mono">l=1…30</text><text x="95" y="86" text-anchor="middle" class="mono">Kᵥˡ,Vᵥˡ</text><text x="95" y="112" text-anchor="middle" class="mono">[1,98,3072]</text><text x="95" y="137" text-anchor="middle" class="small">约 34.5 MiB（bf16）</text></g>
  <path d="M1304 210 H1336" class="arrow"/>
  <g transform="translate(1336 124)"><rect width="270" height="174" class="box purple"/><text x="135" y="27" text-anchor="middle" class="h">⑥ Action Flow Loop × Nₐ</text><text x="16" y="57" class="mono">aᵢ [1,32,dₐ]，tₐ=σᵢ</text><text x="16" y="82" class="small">30 层 ActionDiT；每层读取对应 Kᵥˡ,Vᵥˡ</text><text x="16" y="107" class="small">Qₐ 对 [Kᵥ;Kₐ] 做 mixed attention</text><text x="16" y="132" class="small">action head 预测 velocity</text><text x="16" y="157" class="small">flow scheduler 更新 aᵢ → aᵢ₊₁</text></g>
  <path d="M1606 210 H1638" class="arrow"/>
  <g transform="translate(1638 147)"><rect width="110" height="125" class="box bfill"/><text x="55" y="28" text-anchor="middle" class="h">输出</text><text x="55" y="58" text-anchor="middle" class="small">干净 action</text><text x="55" y="82" text-anchor="middle" class="mono">[32,dₐ]</text><text x="55" y="106" text-anchor="middle" class="small">无视频输出</text></g>
  <rect x="48" y="320" width="1700" height="126" rx="12" class="note"/><text x="70" y="349" class="h">Base 的本质</text><text x="70" y="378" class="txt">只让真实观测 f₀ 以 clean-data timestep t=0 经过一次完整的 30 层 Video Transformer blocks，提取每层 K/V。</text><text x="70" y="407" class="txt">它不是“只跑一次整个模型”：随后仍需执行 Nₐ 次完整 ActionDiT 去噪。论文实验 Nₐ=10；函数参数默认值可能为 20。</text><text x="70" y="432" class="txt strong">成本：1× VideoDiT-block prefill + Nₐ× ActionDiT；没有 Nᵥ 次未来视频去噪。</text>

  <rect x="24" y="504" width="1752" height="500" rx="18" class="lane idm"/><rect x="24" y="504" width="1752" height="54" rx="18" fill="url(#idmHead)"/>
  <text x="50" y="540" class="title">FAST-WAM-IDM：先生成完整未来视频，再用 clean video 表征预测动作</text>
  <g transform="translate(48 582)"><rect width="160" height="130" class="box ifill"/><text x="80" y="27" text-anchor="middle" class="h">① VAE 编码</text><text x="80" y="58" text-anchor="middle" class="mono">f₀ [1,48,1,14,28]</text><text x="80" y="87" text-anchor="middle" class="small">来自当前真实观测</text><text x="80" y="111" text-anchor="middle" class="small">始终保持干净</text></g>
  <path d="M208 647 H238" class="arrow"/>
  <g transform="translate(238 572)"><rect width="220" height="150" class="box ifill"/><text x="110" y="27" text-anchor="middle" class="h">② 初始化视频 latent</text><text x="110" y="57" text-anchor="middle" class="mono">zᴺ ~ N(0,I)</text><text x="110" y="83" text-anchor="middle" class="mono">[1,48,3,14,28]</text><text x="110" y="109" text-anchor="middle" class="small">9 RGB frames → 3 latent frames</text><text x="110" y="134" text-anchor="middle" class="small strong">覆盖 index 0 ← clean f₀</text></g>
  <path d="M458 647 H488" class="arrow"/>
  <g transform="translate(488 566)"><rect width="350" height="162" class="box idm"/><text x="175" y="27" text-anchor="middle" class="h">③ Stage 1：Video Denoising × Nᵥ</text><text x="18" y="58" class="small">每步完整 forward：</text><text x="18" y="83" class="small">pre_dit(t=σᵢ) → 30 Video blocks → video head</text><text x="18" y="108" class="small">→ velocity → video scheduler update</text><text x="18" y="135" class="small strong">每次 update 后再次覆盖 temporal index 0 ← f₀</text></g>
  <path d="M838 647 H868" class="arrow"/>
  <g transform="translate(868 572)"><rect width="220" height="150" class="box ifill"/><text x="110" y="27" text-anchor="middle" class="h">④ 去噪完成</text><text x="110" y="57" text-anchor="middle" class="mono">ẑ=[f₀,f̂₁,f̂₂]</text><text x="110" y="83" text-anchor="middle" class="mono">[1,48,3,14,28]</text><text x="110" y="110" text-anchor="middle" class="small">这是 scheduler 更新后的 clean latent</text><text x="110" y="134" text-anchor="middle" class="small">不是最后一步的 velocity 输出</text></g>
  <path d="M1088 647 H1118" class="arrow"/>
  <g transform="translate(1118 562)"><rect width="300" height="170" class="box orange"/><text x="150" y="27" text-anchor="middle" class="h">⑤ Stage 2：整段视频重新以 tᵥ=0 编码</text><text x="18" y="58" class="small">pre_dit：48×3×14×28 →</text><text x="18" y="82" class="mono">294 tokens × Dᵥ=3072</text><text x="18" y="107" class="small">3D RoPE；所有 token 的 time modulation = 0</text><text x="18" y="132" class="small">再跑 30 层 Video blocks，缓存每层 K/V</text><text x="18" y="155" class="small strong">无 video head；无 scheduler update</text></g>
  <path d="M1418 647 H1448" class="arrow"/>
  <g transform="translate(1448 572)"><rect width="150" height="150" class="box cache"/><text x="75" y="27" text-anchor="middle" class="h">⑥ Full-video KV</text><text x="75" y="57" text-anchor="middle" class="mono">30 layers</text><text x="75" y="83" text-anchor="middle" class="mono">[1,294,3072]</text><text x="75" y="108" text-anchor="middle" class="small">约 103.4 MiB</text><text x="75" y="132" text-anchor="middle" class="small">Base 的 3×长度</text></g>
  <path d="M1598 647 H1628" class="arrow"/>
  <g transform="translate(1628 562)"><rect width="120" height="170" class="box purple"/><text x="60" y="27" text-anchor="middle" class="h">⑦ 动作</text><text x="60" y="59" text-anchor="middle" class="small">Nₐ 次</text><text x="60" y="83" text-anchor="middle" class="small">ActionDiT</text><text x="60" y="108" text-anchor="middle" class="small">读取整段</text><text x="60" y="130" text-anchor="middle" class="small">视频 K/V</text><text x="60" y="154" text-anchor="middle" class="small">输出 action</text></g>
  <rect x="48" y="758" width="1700" height="210" rx="12" class="note"/><text x="70" y="789" class="h">为什么已经去噪完成，还要以 t=0 再跑一次？</text><text x="70" y="820" class="txt">① Stage 1 每个 σᵢ forward 的职责是预测 velocity，经过 video head 后供 scheduler 更新 latent；这些中间层 K/V 对应不同噪声状态，不能直接作为稳定 action condition。</text><text x="70" y="850" class="txt">② 去噪结束得到的是 clean latent ẑ，而不是已经计算好的“clean-timestep 分层特征”。因此需要把 ẑ 重新送入 pre_dit(t=0)+30 blocks。</text><text x="70" y="880" class="txt">③ 这次 prefill 的职责是建立与 IDM 训练 cond-video 分支一致的 clean-condition 表征，并保存每层 Kᵥˡ/Vᵥˡ，供所有 action 去噪步复用。</text><text x="70" y="910" class="txt strong">IDM 成本：Nᵥ×完整 VideoDiT 去噪 + 1×整段视频 t=0 prefill + Nₐ×ActionDiT + VAE decode。</text><text x="70" y="941" class="small">注：缓存 MiB 按 batch=1、bf16、仅 K/V tensor 估算，不含 allocator、mask 与中间 activation。</text>

  <rect x="24" y="1028" width="1752" height="68" rx="14" fill="#15253f"/><text x="900" y="1057" text-anchor="middle" class="title" style="font-size:20px">一句话区别：Base 缓存“真实当前帧的 clean world features”；IDM 缓存“模型先想象出的整段 clean future-video features”。</text><text x="900" y="1083" text-anchor="middle" class="title" style="font-size:16px;font-weight:500">两者 t=0 prefill 的代码机制相同，输入序列长度与语义不同；IDM 额外承担 Nᵥ 次视频生成成本。</text>
</svg>
