<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="F8 推理调用流">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4B5565"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<text x="54" y="48" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">F8 推理调用流</text>
<text x="54" y="76" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#596579">热路径与调试读出路径必须分开</text>
<rect x="70" y="228" width="210" height="96" rx="10" fill="#EAF2FF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="86" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">CLI 输入</text>
<text x="86" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="86" dy="0">图像/状态</tspan>
<tspan x="86" dy="17">任务 query</tspan>
</text>
<rect x="350" y="228" width="230" height="96" rx="10" fill="#EEF7F3" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="366" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Prompt builder</text>
<text x="366" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="366" dy="0">assistant prefix</tspan>
<tspan x="366" dy="17">latent markers</tspan>
</text>
<rect x="650" y="228" width="230" height="96" rx="10" fill="#FFF3DF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="666" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">VLM forward</text>
<text x="666" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="666" dy="0">hidden states</tspan>
<tspan x="666" dy="17">answer tokens</tspan>
</text>
<rect x="950" y="160" width="230" height="88" rx="10" fill="#EEF7F3" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="966" y="188" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">轨迹文本</text>
<text x="966" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="966" dy="0">默认热路径</tspan>
<tspan x="966" dy="17">低延迟</tspan>
</text>
<rect x="950" y="396" width="230" height="88" rx="10" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="966" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">可选 reader</text>
<text x="966" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="966" dy="0">解释文本</tspan>
<tspan x="966" dy="17">视觉 token</tspan>
</text>
<path d="M280,276 L350,276" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M580,276 L650,276" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M880,276 L950,276 L950,204" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="956" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">hot</text>
<path d="M765,324 L765,440 L950,440" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="771" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">debug</text>
<rect x="145" y="515" width="150" height="54" rx="9" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.2"/>
<text x="159" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#596579">默认</text>
<text x="159" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">不跑 decoder</text>
<rect x="535" y="515" width="150" height="54" rx="9" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.2"/>
<text x="549" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#596579">解释</text>
<text x="549" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">需要 hidden</text>
<rect x="925" y="515" width="150" height="54" rx="9" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.2"/>
<text x="939" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#596579">阻塞</text>
<text x="939" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">torch/weights</text>
<line x1="54" y1="660" x2="1226" y2="660" stroke="#AEB8C6" stroke-width="1"/>
<text x="54" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">报告关注实现逻辑；环境阻塞不写成算法失败。</text>
</svg>
