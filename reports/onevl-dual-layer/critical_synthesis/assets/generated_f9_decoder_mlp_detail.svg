<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="F9 decoder 与 MLP 输出头">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4B5565"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<text x="54" y="48" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">F9 decoder 与 MLP 输出头</text>
<text x="54" y="76" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="500" fill="#596579">三条输出路径对应不同成本和意义</text>
<rect x="92" y="296" width="230" height="100" rx="10" fill="#FFF3DF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="108" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">last latent state</text>
<text x="108" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="108" dy="0">共享压缩表征</tspan>
<tspan x="108" dy="17">取特定位置</tspan>
</text>
<rect x="470" y="128" width="260" height="88" rx="10" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="486" y="156" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">语言 decoder</text>
<text x="486" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="486" dy="0">解释 token</tspan>
<tspan x="486" dy="17">离线审计</tspan>
</text>
<rect x="470" y="304" width="260" height="88" rx="10" fill="#EEF7F3" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="486" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">AR 轨迹答案</text>
<text x="486" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="486" dy="0">高精度路径</tspan>
<tspan x="486" dy="17">answer tokens</tspan>
</text>
<rect x="470" y="480" width="260" height="88" rx="10" fill="#EEF7F3" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="486" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">MLP head</text>
<text x="486" y="534" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="486" dy="0">float waypoints</tspan>
<tspan x="486" dy="17">0.24s 变体</tspan>
</text>
<rect x="910" y="302" width="240" height="112" rx="10" fill="#FCEDEA" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="926" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">部署选择</text>
<text x="926" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="926" dy="0">精度-延迟折中</tspan>
<tspan x="926" dy="17">指标不能混读</tspan>
</text>
<path d="M322,346 L470,346 L470,172" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="476" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">read</text>
<path d="M322,346 L470,346 L470,348" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="476" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">generate</text>
<path d="M322,346 L470,346 L470,524" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="476" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">regress</text>
<path d="M730,348 L910,348 L910,344" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="916" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">compare</text>
<path d="M730,524 L910,524 L910,372" fill="none" stroke="#4B5565" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="916" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">compare</text>
<rect x="90" y="520" width="150" height="54" rx="9" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.2"/>
<text x="104" y="541" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#596579">AR</text>
<text x="104" y="563" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">88.84 PDM</text>
<rect x="940" y="520" width="150" height="54" rx="9" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.2"/>
<text x="954" y="541" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#596579">MLP</text>
<text x="954" y="563" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">86.83 / 0.24s</text>
<line x1="54" y1="660" x2="1226" y2="660" stroke="#AEB8C6" stroke-width="1"/>
<text x="54" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#596579">同一个 latent 可以服务解释、AR 轨迹或 MLP 轨迹；比较时必须标明 head type。</text>
</svg>
