<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#556376"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>
<text x="42" y="42" font-size="22" font-weight="700" fill="#172033">部署 Pareto：AR answer 与 MLP head</text>
<text x="42" y="70" font-size="13" font-weight="500" text-anchor="start" fill="#596579">experimental tradeoff panel；用坐标而不是框图</text>
<rect x="70" y="110" width="650" height="520" rx="12" fill="#FFFFFF" stroke="#D8DEE8"/>
<text x="86" y="135" font-size="13" font-weight="700" text-anchor="start" fill="#596579">速度 / 精度取舍</text>
<line x1="150" y1="560" x2="650" y2="560" stroke="#172033" stroke-width="2"/>
<line x1="150" y1="560" x2="150" y2="170" stroke="#172033" stroke-width="2"/>
<text x="455" y="610" font-size="13" font-weight="600" text-anchor="middle" fill="#596579">latency 越低越好</text>
<text x="78" y="190" font-size="13" font-weight="600" text-anchor="start" fill="#596579">PDM 越高越好</text>
<circle cx="520" cy="230" r="10" fill="#1F6FEB"/>
<text x="538" y="222" font-size="12" font-weight="600" text-anchor="start" fill="#172033">OneVL AR</text>
<text x="538" y="242" font-size="12" font-weight="500" text-anchor="start" fill="#596579">4.46s / 88.84</text>
<circle cx="240" cy="270" r="10" fill="#168A52"/>
<text x="258" y="262" font-size="12" font-weight="600" text-anchor="start" fill="#172033">MLP head</text>
<text x="258" y="282" font-size="12" font-weight="500" text-anchor="start" fill="#596579">0.24s / 86.83</text>
<circle cx="610" cy="390" r="10" fill="#C2412D"/>
<text x="628" y="382" font-size="12" font-weight="600" text-anchor="start" fill="#172033">显式 CoT</text>
<text x="628" y="402" font-size="12" font-weight="500" text-anchor="start" fill="#596579">慢</text>
<path d="M 520 245 L 520 290 L 260 290 L 260 270" fill="none" stroke="#556376" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="300" width="86" height="30" rx="15" fill="#FFFFFF" stroke="#AEB8C6"/>
<text x="403" y="320" font-size="12" font-weight="600" text-anchor="middle" fill="#172033">低延迟</text>
<rect x="780" y="126" width="390" height="430" rx="12" fill="#F2EDFF" stroke="#D8DEE8"/>
<text x="796" y="151" font-size="13" font-weight="700" text-anchor="start" fill="#596579">部署读法</text>
<rect x="820" y="185" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#AEB8C6" stroke-width="1.3"/>
<text x="836" y="213" font-size="15" font-weight="700" text-anchor="start" fill="#172033">AR answer</text>
<text x="836" y="239" font-size="12" font-weight="500" text-anchor="start" fill="#596579">保留自回归表达</text>
<text x="836" y="260" font-size="12" font-weight="500" text-anchor="start" fill="#596579">精度更高</text>
<rect x="820" y="300" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#AEB8C6" stroke-width="1.3"/>
<text x="836" y="328" font-size="15" font-weight="700" text-anchor="start" fill="#172033">MLP head</text>
<text x="836" y="354" font-size="12" font-weight="500" text-anchor="start" fill="#596579">直接回归 waypoint</text>
<text x="836" y="375" font-size="12" font-weight="500" text-anchor="start" fill="#596579">速度更快</text>
<rect x="820" y="420" width="300" height="62" rx="10" fill="#FCEDEA" stroke="#C2412D" stroke-width="1.3"/>
<text x="836" y="448" font-size="15" font-weight="700" text-anchor="start" fill="#172033">禁止混读</text>
<text x="836" y="474" font-size="12" font-weight="500" text-anchor="start" fill="#596579">不同 head 的速度/精度不能合并比较</text>
</svg>