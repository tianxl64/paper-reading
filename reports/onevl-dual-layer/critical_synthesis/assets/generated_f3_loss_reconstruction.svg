<rect x="900" y="292" width="250" height="120" rx="10" fill="#EEF7F3" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="916" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">联合压力</text>
<text x="916" y="346" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#596579">
<tspan x="916" dy="0">L = Lc + λlLl + λvLv</tspan>
<tspan x="916" dy="17">λl=1.0, λv=0.1</tspan>
</text>
