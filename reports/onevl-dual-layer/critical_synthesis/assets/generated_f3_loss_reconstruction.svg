<tspan x="478" dy="17">可解释读出</tspan>
</text>
<rect x="462" y="490" width="260" height="90" rx="10" fill="#F2EDFF" stroke="#AEB8C6" stroke-width="1.5"/>
<text x="478" y="518" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">视觉损失</text>
