<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M 0,0 L 10,5 L 0,10 z" fill="#315f8f"/>
  </marker>
</defs>
<style>
  .title{font:700 24px Arial,"Microsoft YaHei",sans-serif;fill:#1b2533}
  .sub{font:600 15px Arial,"Microsoft YaHei",sans-serif;fill:#35465c}
  .txt{font:500 14px Arial,"Microsoft YaHei",sans-serif;fill:#26364a}
  .tiny{font:500 12px Arial,"Microsoft YaHei",sans-serif;fill:#5f6f80}
  .box{rx:12;fill:#f8fbff;stroke:#aec3da;stroke-width:1.5}
  .key{rx:12;fill:#e8f2ff;stroke:#4d7fb2;stroke-width:2}
  .warn{rx:12;fill:#fff6e8;stroke:#d79b42;stroke-width:1.7}
  .ok{rx:12;fill:#edf8f2;stroke:#55a06b;stroke-width:1.7}
  .bad{rx:12;fill:#fff0f0;stroke:#c95d5d;stroke-width:1.7}
  .line{stroke:#315f8f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style>

<text class="title" x="48" y="46">总览：锚点截断扩散到 RL 约束再到选择器</text>
<rect class="box" x="50" y="95" width="185" height="88"/><text class="txt" x="142" y="123" text-anchor="middle"><tspan x="142" dy="0">场景输入</tspan><tspan x="142" dy="18">三相机+BEV</tspan></text>
<path class="line" d="M235,139 L310,139"/>
<rect class="box" x="310" y="95" width="185" height="88"/><text class="txt" x="402" y="123" text-anchor="middle"><tspan x="402" dy="0">ResNet-34</tspan><tspan x="402" dy="18">TransFuser</tspan><tspan x="402" dy="18">特征</tspan></text>
<path class="line" d="M495,139 L570,139"/>
<rect class="key" x="570" y="82" width="210" height="112"/><text class="txt" x="675" y="110" text-anchor="middle"><tspan x="675" dy="0">锚点GMM+截断扩散</tspan></text>
<path class="line" d="M780,139 L855,139"/>
<rect class="warn" x="855" y="82" width="210" height="112"/><text class="txt" x="960" y="110" text-anchor="middle"><tspan x="960" dy="0">乘性噪声+GRPO</tspan></text>
<path class="line" d="M1065,139 L1130,139"/>
<rect class="ok" x="1130" y="95" width="120" height="88"/><text class="txt" x="1190" y="123" text-anchor="middle"><tspan x="1190" dy="0">高质量多模态轨迹</tspan></text>
<rect class="key" x="250" y="285" width="190" height="84"/><text class="txt" x="345" y="313" text-anchor="middle"><tspan x="345" dy="0">Intra:</tspan><tspan x="345" dy="18">只在同锚内估</tspan><tspan x="345" dy="18">advantage</tspan></text>
<rect class="warn" x="520" y="285" width="190" height="84"/><text class="txt" x="615" y="313" text-anchor="middle"><tspan x="615" dy="0">Inter:</tspan><tspan x="615" dy="18">负优势截断失败强惩罚</tspan></text>
<rect class="ok" x="790" y="285" width="190" height="84"/><text class="txt" x="885" y="313" text-anchor="middle"><tspan x="885" dy="0">Selector:</tspan><tspan x="885" dy="18">coarse</tspan><tspan x="885" dy="18">top-kfine</tspan></text>
<path class="line" d="M440,327 L520,327"/>
<path class="line" d="M710,327 L790,327"/>
<rect class="box" x="355" y="495" width="185" height="82"/><text class="txt" x="447" y="523" text-anchor="middle"><tspan x="447" dy="0">PDMS:</tspan><tspan x="447" dy="18">NC*DAC*(5EP+5TTC+2C)</tspan><tspan x="447" dy="18">/12</tspan></text>
<rect class="ok" x="610" y="495" width="185" height="82"/><text class="txt" x="702" y="523" text-anchor="middle"><tspan x="702" dy="0">证据:91.2PDMS</tspan><tspan x="702" dy="18">85.5EPDMS</tspan></text>
<rect class="bad" x="865" y="495" width="185" height="82"/><text class="txt" x="957" y="523" text-anchor="middle"><tspan x="957" dy="0">边界:</tspan><tspan x="957" dy="18">checkpoint+cache</tspan><tspan x="957" dy="18">才能复现</tspan></text>
<path class="line" d="M540,536 L610,536"/>
<path class="line" d="M795,536 L865,536"/>
</svg>
