<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs><rect x="60" y="150" width="250" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="76" y="184" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">RGB 多视角</text><text x="76" y="214" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">O_0 + proprio s_0 + noisy action</text><rect x="390" y="120" width="300" height="180" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="406" y="154" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">Wan2.2 DiT</text><text x="406" y="184" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享主干；RGB/state/action latent</text><rect x="790" y="100" width="290" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="806" y="134" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">Depth branch</text><text x="806" y="164" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">复制最后 M blocks；单向读取主干</text><rect x="790" y="280" width="290" height="130" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="806" y="314" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">ANS denoise</text><text x="806" y="344" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">T_a &lt; T_O；action 先完成</text><rect x="1180" y="190" width="330" height="150" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="1196" y="224" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">4D 输出</text><text x="1196" y="254" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">RGB + depth + state + action</text><path d="M310,215 L390,215" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M690,190 L790,165" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M690,250 L790,345" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1080,225 L1180,260" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1180,320 L180,320" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="680" y="312" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">real robot loop</text><rect x="120" y="520" width="420" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="136" y="554" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练 joint distribution</text><text x="136" y="584" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">约束 t_O ≥ t_a；匹配异步推理</text><rect x="640" y="520" width="420" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="656" y="554" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">空间监督</text><text x="656" y="584" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">inverse depth MSE；不把 depth token 拼入序列</text><rect x="1160" y="520" width="340" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1176" y="554" font-size="20" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险</text><text x="1176" y="584" font-size="15" fill="#374151" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">depth branch / VAE / geometry 误差</text></svg>